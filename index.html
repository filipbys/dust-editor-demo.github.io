    <script type="module">// @ts-check

// TODO add test to ensure uniqueness
// TODO add test to check that no consecutive integers are skipped
// TODO add snapshot tests to ensure nobody accidentally changes/removes a value or its name, which would break backwards-compatibility. Values can be deprecated but never removed.

const PARSE_NUMBER_ERROR__INVALID_STRING = 0,
  PARSE_NUMBER_ERROR__OUT_OF_BOUNDS = 1,
  JSON_ERROR__CANNOT_STRINGIFY = 12;

// @ts-check

/** @import { Err, FatalError, MethodArgs, MethodKeys, UnbreakableVow } from "./types.d.ts" */

const ERR_TAG = "ErrorsAsValuesError";

/** @template E @param {E} cause @returns {Err<E>} */
const err = (cause) =>
  Object.freeze([Object.freeze(cause), ERR_TAG]);

/**
 * @template E
 * @param {Err<E>} err 
 * @returns {E} The cause of the {@link err}.
 */
const errCause = ([cause]) => cause;

/** @type {<T, E=unknown>(result: T | Err<E>) => result is Err<E>} */
const isErr = (result) =>
  Array.isArray(result) && (result.length === 2) && (result[1] === ERR_TAG);

/**
 * @param {unknown} error 
 * @returns {error is FatalError}
 */
const isFatalError = (error) =>
  // TODO use Error.isError once it's available.
  (error instanceof Error) && (error.isFatal === true);

// @ts-check


/** @import {Err, FetchResult, ParseNumberError, UnbreakableVow, VowWithResolver, FatalError, JSONValue, JSONReviver, JSONReplacer, ParseJSON} from "./types.d.ts" */
/** @import {FiniteNumber} from "./number-types.d.ts" */

/**
 * Returns a floating point number between negative {@link Number.MAX_VALUE} and
 * {@link Number.MAX_VALUE}, inclusive, parsed from {@link string}, or an
 * {@link Err} if the string does not represent such a floating point number.
 * @param {string} string 
 * @returns {FiniteNumber | Err<ParseNumberError>}
 */
const parseFloatSafe = (string) =>
  parseNumber(string, FLOAT_REGEX, parseFloat, Number.isFinite);

/**
 * Returns an integer between {@link Number.MIN_SAFE_INTEGER} and
 * {@link Number.MAX_SAFE_INTEGER}, inclusive, parsed from {@link string}, or an
 * {@link Err} if the string does not represent such an integer.
 * @param {string} string 
 * @returns {FiniteNumber | Err<ParseNumberError>}
 */
const parseIntSafe = (string) =>
  parseNumber(string, INT_REGEX, parseInt, Number.isSafeInteger);

/**
 * @param {string} string 
 * @param {RegExp} regex 
 * @param {(string: string) => number} parseFn 
 * @param {(number: number) => boolean} boundsCheck 
 * @returns {FiniteNumber | Err<ParseNumberError>}
 */
const parseNumber = (string, regex, parseFn, boundsCheck) => {
  if (!regex.test(string)) {
    return INVALID_STRING_ERROR;
  }
  const number = parseFn(string);
  if (!boundsCheck(number)) {
    return OUT_OF_BOUNDS_ERROR;
  }
  return /** @type {FiniteNumber} */(number);
};

const
  INT_REGEX = /^[+-]?\d+$/,
  FLOAT_REGEX = /^[+-]?\d*(\.\d+)?(e[+-]?\d+)?$/;


/** @type {ParseJSON} See {@link ParseJSON} docs. */
const parseJSON = /** @type {ParseJSON} */(
  /**
   * @param {string} string 
   * @param {JSONReviver} [reviver] 
   * @returns {JSONValue | Err<SyntaxError | {reviverError: unknown}>}
   */
  (string, reviver) => {
    try {
      return JSON.parse(string, reviver);
    } catch (error) {
      if (isFatalError(error))
        throw error;
      if (error instanceof SyntaxError)
        return err(error);

      throw new
        /** @implements {FatalError} */
        class extends Error {
          /** @type {true} */ isFatal = true;
        }("JSON.parse", { cause: error });
    }
  }
);

const /** @type {Err<typeof PARSE_NUMBER_ERROR__INVALID_STRING>} */
  INVALID_STRING_ERROR = err(PARSE_NUMBER_ERROR__INVALID_STRING),
  /** @type {Err<typeof PARSE_NUMBER_ERROR__OUT_OF_BOUNDS>} */
  OUT_OF_BOUNDS_ERROR = err(PARSE_NUMBER_ERROR__OUT_OF_BOUNDS);
  /** @type {Err<typeof JSON_ERROR__CANNOT_STRINGIFY>} */
  err(JSON_ERROR__CANNOT_STRINGIFY);

// @ts-check

/**
 * Returns the closest number to {@link value} that is between {@link min} and {@link max}, inclusive.
 * @param {number} min 
 * @param {number} value 
 * @param {number} max 
 * @returns {number}
 */
const clamp = (min, value, max) => Math.max(min, Math.min(value, max));

// @ts-check

/** @import { InternalState } from "./internal-state.mjs" */

const specialKeyName =
  // NOTE: clean up if https://developer.mozilla.org/en-US/docs/Web/API/Navigator/userAgentData becomes standard
  (
    /** @type {{readonly userAgentData?: {readonly platform: string}}} */(navigator).userAgentData?.platform
    ?? navigator.platform
  ).includes("Mac") ? '⌘' : "Ctrl";


/** @type {(event: KeyboardEvent | PointerEvent) => boolean} */
const specialKeyPressed = 
  specialKeyName === '⌘'
  ? (event) => event.metaKey
  : (event) => event.ctrlKey;

/**
 * TODO:
 * - explain why it's needed
 * - add setting to override it
 * - reload relevant parts of the code if it changes
 * - use userAgent/other hints to improve accuracy (the editor cares most about the presence of a physical keyboard, not `pointer: fine`)
 * 
 * @param {string} localStorageKey
 * @param {HTMLElement} editor
 * @returns {"desktop" | "mobile"}
 */
const detectDeviceType = (localStorageKey, editor) => {
  const
    urlKey = "device-type",
    urlMode = new URLSearchParams(location.search).get(urlKey);
   if (isValidDeviceType(urlMode)) {
    return urlMode;
  } else if (urlMode !== null) {
    console.warn(deviceTypeErrorMessage("URL search param", urlKey, urlMode), editor);
  }

  const storedMode = localStorage.getItem(localStorageKey);
  if (isValidDeviceType(storedMode)) {
    return storedMode;
  } else if (storedMode !== null) {
    console.warn(deviceTypeErrorMessage("localStorage", localStorageKey, storedMode), editor);
  }
  if (matchMedia("(pointer: fine)").matches) {
    return "desktop";
  }
  return "mobile";
};

const DEVICE_TYPES = ["desktop", "mobile"];
/**
 * 
 * @param {string | null | undefined} name 
 * @returns {name is "desktop" | "mobile"}
 */
const isValidDeviceType = (name) => !!name && DEVICE_TYPES.includes(name);

/**
 * 
 * @param {string} category 
 * @param {string} key 
 * @param {string} value 
 * @returns {string}
 */
const deviceTypeErrorMessage = (category, key, value) =>
  `Ignoring ${category} "${key}" (${value}) because it's not one of [${DEVICE_TYPES.map(it => `"${it}"`).join(", ")}]`;

/** @param {InternalState} state */
const updateNativeSelection = (state) => {
  const
    selection = document.getSelection(),
    {start, end} = state.selectedRange;
  let startNode, startOffset = 0;
  {
    let index = 0;
    const walker = document.createTreeWalker(state.program, NodeFilter.SHOW_TEXT);
    for (let node; (node = walker.nextNode());) {
      const len = /** @type {Text} */(node).data.length;
      if ((index <= start) && (start <= (index + len))) {
        startNode = node;
        startOffset = start - index;
        break;
      }
      index += len;
    }
  }
  // TODO cleanup
  let endNode, endOffset = 0;
  {
    let index = 0;
    const walker = document.createTreeWalker(state.program, NodeFilter.SHOW_TEXT);
    for (let node; (node = walker.nextNode());) {
      const len = /** @type {Text} */(node).data.length;
      if ((index <= end) && (end <= (index + len))) {
        endNode = node;
        endOffset = end - index;
        break;
      }
      index += len;
    }
  }
  if (!startNode || !endNode || !selection) {
    console.error(`Failed to find start or end node start=${start}, end=${end}, or document.getSelection() returned null`, startNode, endNode, selection, state.editor);
    return;
  }
  const ranges = selection.getComposedRanges({shadowRoots: [state.shadowRoot]});

  if (
    (ranges.length === 1) &&
    (startNode === ranges[0].startContainer) &&
    (startOffset === ranges[0].startOffset) &&
    (endNode === ranges[0].endContainer) &&
    (endOffset === ranges[0].endOffset)
  ) {
    // console.log(`selection is already from`, startNode, startOffset, `to`, endNode, endOffset);
    return;
  }
  // console.log(`setting selection from`, startNode, startOffset, `to`, endNode, endOffset);
  selection.setBaseAndExtent(startNode, startOffset, endNode, endOffset);
};

/** @param {InternalState} state */
const updateVirtualSelection = (state) => {
  const selection = document.getSelection();
  if (!selection) {
    console.error(`document.getSelection() returned null`);
    return;
  }
  const ranges = selection.getComposedRanges({shadowRoots: [state.shadowRoot]});
  
  // console.log(
  //   `${new Date().toISOString()} selection:\nfrom ${selection.anchorOffset} in`, selection.anchorNode,
  //   `\nto ${selection.focusOffset} in`, selection.focusNode,
  //   `\nactive:`, state.shadowRoot.activeElement,
  //   `\n`, event, ranges,
  // );
  if (ranges.length !== 1) {
    return;
  }
  const range = ranges[0];

  // console.log(
  //   `range from ${range.startOffset} in`, range.startContainer,
  //   `\n to ${range.endOffset} in`, range.endContainer,
  // );
  if (!state.program.contains(range.startContainer) || !state.program.contains(range.endContainer)) {
    return;
  }

  {
    let index = 0;
    const walker = document.createTreeWalker(state.program, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      if (node === range.startContainer) {
        state.selectedRange.start = index + range.startOffset;
        break;
      }
      index += /** @type {Text} */(node).data.length;
    }
    if (!node) {
      console.error(`Failed to find start node in program`, node);
    }
  }
  // TODO cleanup
  {
    let index = 0;
    const walker = document.createTreeWalker(state.program, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      if (node === range.endContainer) {
        state.selectedRange.end = index + range.endOffset;
        break;
      }
      index += /** @type {Text} */(node).data.length;
    }
    if (!node) {
      console.error(`Failed to find end node in program`, node);
    }
  }
};

/**
 * Specializes the behavior of the editor based on device capabilities:
 * - On devices that don't have a physical keyboard, like mobile, it needs to
 *   be able to bring up the virtual keyboard, which means the
 *   {@link InternalState.program} needs to be `contenteditable`.
 *   - TODO could try a hack like this, but it will likely cause more issues:
 *     ```
 *     const customElement = document.getElementById('myCustomElement');
 *     const hiddenInput = document.getElementById('hiddenInput');
 *
 *     customElement.addEventListener('click', () => {
 *       // Focus the hidden input to show the virtual keyboard
 *       hiddenInput.focus();
 *     });
 *
 *     hiddenInput.addEventListener('input', (event) => {
 *       // Handle the input value here and update your custom element

 * @param {DustGap[]} gaps
 * @param {DustNode[]} nodes
 * @param {number} startIndex
 */
const createInlineGroups = (state, gaps, nodes, startIndex) => {
  // TODO try creating a new array (O(n)) instead of using `splice` (potentially O(n^2)) and measure performance difference on various inputs
  // Alternatively, keep a `tailIndex` while modifying the array in place, leaving holes in until the end, then shift everything left to fill in the wholes at the end in a single O(n) operation.

  parseDollarSignsAndUnaryMinuses(state, gaps, nodes, startIndex);
  // '.'s get parsed after '$' and '-' for cases like this:
  // - 2^-n ==> equivalent to `2^(-n)`
  // - (my-array.-n + 2) ==> equivalent to `(my-array.(-n) + 2)`
  // - (.$add2 $x = x + 2)
  parsePeriods(state, gaps, nodes, startIndex);
  // '^'s get parsed last for cases like this 
  // - -2^-3.14 ==> equivalent to `(-2) ^ (-3.14)
  parseCompactExponents(state, gaps, nodes, startIndex);
};

/**
 * @param {ParseState} state
 * @param {DustGap[]} gaps
 * @param {DustNode[]} nodes
 * @param {number} startIndex
 */
const parseDollarSignsAndUnaryMinuses = (state, gaps, nodes, startIndex) => {
  for (let index = startIndex; index < nodes.length; index++) {
    const node = nodes[index];
    if (node.type === '$') {
      if (
        !isFirstOrAfterGap(gaps, index) &&
        (nodes[index - 1].type !== '.')
      ) {
        addError(state, nodes[index], {message: `Expected a '(', whitespace, or comment before '$'`});
        continue;
      }
      if (
        isLastOrBeforeGap(gaps, index) ||
        (nodes[index + 1].type === '.')
      ) {
        // the '$' is an anonymous parameter, e.g. ($ + 1) or (2 * $) or $.fn
        continue;
      }
      const nextNode = nodes[index + 1];
      if (nextNode.type !== "identifier") {
        addError(state, nextNode, {message: `Expected identifier, whitespace, bracket, or '.' after '$'`});
        continue;
      }
      splice(
        gaps, nodes, index, 2,
        groupNode("identifier_declaration", GAPS_FOR_COMPACT_GROUP_2, [node, nextNode]),
      );
    } else if (isOperator(node, '-')) {
      if (
        !isFirstOrAfterGap(gaps, index) &&
        (nodes[index - 1].type !== '.')
      ) {
        // Not first, not preceded by bracket, whitespace, or '.', therefore the '-' is a binary operator:
        // (<node>-<node>)
        // (<node>- <node>)
        continue;
      }
      const nextIndex = index + 1;
      if (nextIndex === nodes.length) {
        // <node>-
        // (... -)
        addError(state, node, {message: `Expected an expression after '-'`});
        continue;
      }
      const nextNode = nodes[nextIndex];
      if (isBeforeGap(gaps, index)) {
        // There's a gap after the '-', therefore it's a binary operator:
        // (<node> - <node>)
        // ((<nodes...>)-(<nodes...>))
        // (<node>-/*comment*/<node>)
        continue;
      }
      // Otherwise, it's a unary operator
      // -<node>
      // (-<node> ...)
      switch (nextNode.type) {
        case '.':
        case "keyword":
        case "operator":
          addError(state, nextNode, {message: `A "${nextNode.type}" is not allowed after '-'`});
          continue;
      }
      if (isLastOrBeforeGap(gaps, nextIndex)) {
        splice(
          gaps, nodes, index, 2,
          groupNode("function_call", GAPS_FOR_COMPACT_GROUP_2, [node, nextNode]),
        );
        continue;
      }
      let possibleEnd = nextIndex + 1;
      while (!isLastOrBeforeGap(gaps, possibleEnd)) {
        possibleEnd++;
      }
      addError(state, node, {
        message: `Ambiguous order of operations: '-' may refer to the node immediately after it, or to the next ${possibleEnd - index} nodes, or possibly something in between. Please add parentheses to disambiguate.`
      });
    }
  }
};

/**
 * @param {ParseState} state
 * @param {DustGap[]} gaps
 * @param {DustNode[]} nodes
 * @param {number} startIndex
 */
const parsePeriods = (state, gaps, nodes, startIndex) => {
  for (let index = startIndex; index < (nodes.length - 1);) {
    const node = nodes[index];
    if (node.type !== '.') {
      index++;
      continue;
    }
    const nextNode = nodes[index + 1];
    switch (nextNode.type) {
      case '$':
      case ':':
      case '=':
      case '.': // TODO maybe give '..' and '...' a meaning
        addError(state, nextNode, {message: `Unexpected '${nextNode.text}' after '.'`});
        index += 2;
        continue;
      case "keyword":
      case "operator":
      case "character":
      case "text":
      case "variable_declaration":
      case "typed_declaration":
      case "definition":
      case "function_called":
        addError(state, nextNode, {message: `Unexpected ${nextNode.type} after '.'`});
        index += 2;
        continue;
    }
    if (isBeforeGap(gaps, index)) {
      // E.g. (a. b), (a . b)
      let gap = gaps[index + 1];
      const error = {message: `Unexpected gap between '.' and the function being called`};
      if (typeof gap === "string") {
        if (gap === '\n') {
          addError(state, node, error);
        } else {
          gaps[index + 1] = gap = errorGapNode(state, gap, error);
        }
      } else {
        addError(state, Array.isArray(gap) ? gap[0] : gap, error);
      }
      splice(
        gaps, nodes, index, 2,
        groupNode("function_called", ["", gap, ""], [node, nextNode]),
      );
      index++;
      continue;
    }
    if (isFirstOrAfterGap(gaps, index)) {
      // E.g.: (a .foo b), (.foo a b)
      splice(
        gaps, nodes, index, 2,
        groupNode("function_called", GAPS_FOR_COMPACT_GROUP_2, [node, nextNode]),
      );
      // `index` now refers to the new group node: advance it
      index++;
      continue;
    }
    // E.g.: a.foo, (a + b).foo
    const prevNode = nodes[index - 1];
    splice(
      gaps, nodes, index - 1, 3,
      (prevNode.type === "integer_literal") && (nextNode.type === "integer_literal")
        ? leafNode("decimal_literal", `${prevNode.text}.${nextNode.text}`)
        : groupNode("function_call", GAPS_FOR_COMPACT_GROUP_2, [
          prevNode,
          groupNode("function_called", GAPS_FOR_COMPACT_GROUP_2, [node, nextNode])
        ]),
    );
    // `index` now refers to the next node: no need to increment
  }
  if (nodes[nodes.length - 1].type === '.') {
    addError(state, nodes[nodes.length - 1], {message: `Expected expression after '.'`});
  }
};

/**
 * @param {ParseState} state
 * @param {DustGap[]} gaps
 * @param {DustNode[]} nodes
 * @param {number} startIndex
 */
const parseCompactExponents = (state, gaps, nodes, startIndex) => {
  if (isOperator(nodes[startIndex], '^')) {
    addError(state, nodes[startIndex], {message: `Expected expression before '^'`});
  }
  let index = startIndex + 1;
  while (index < (nodes.length - 1)) {
    const node = nodes[index];
    if (!isOperator(node, '^')) {
      index++;
      continue;
    }
    const 
      prevNode = checkNodeNextToExponentOperator(state, nodes[index - 1], "before"),
      nextNode = checkNodeNextToExponentOperator(state, nodes[index + 1], "after");
    if (!prevNode || !nextNode || isAfterGap(gaps, index) || isBeforeGap(gaps, index)) {
      // There's either an error, or a gap before or after the '^': it should stay part of its current group
      index++;
      continue;
    }
    splice(
      gaps, nodes, index - 1, 3,
      groupNode("function_call", GAPS_FOR_COMPACT_GROUP_3, [prevNode, node, nextNode])
    );
    continue; // `index` now refers to the next node
  }
  if (isOperator(nodes[nodes.length - 1], '^')) {
    addError(state, nodes[nodes.length - 1], {message: `Expected expression after '^'`});
  }
};



/**
 * @param {ParseState} state
 * @param {DustNode} node
 * @param {"before" | "after"} position
 * @returns {DustNode | null}
 */
const checkNodeNextToExponentOperator = (state, node, position) => {
  switch (node.type) {
    // TODO: it may be better to specify the types that *are* allowed
    case '$':
    case ':':
    case '=':
    case '.':
    case "keyword":
    case "operator":
    case "character":
    case "text":
    case "variable_declaration":
    case "typed_declaration":
    case "definition":
    case "function_called":
    case "record":
    case "array":
      addError(state, node, {message: `Unexpected ${node.type} ${position} '^'`});
      return null;
  }
  return node;
};

/**
 * @template {DustOperator} T
 * @param {DustNode} node 
 * @param {T} operator 
 * @returns {node is DustOperatorNodeMap[T]}
 */
const isOperator = (node, operator) => (node.type === "operator") && (node.text === operator);

/** @typedef {readonly [DustOperator, ...DustOperator[]]} AtLeastOneOperator */

const 
  /** @type {AtLeastOneOperator} */
  ADDITION_OPERATORS = Object.freeze(['+', '-']),
  /** @type {AtLeastOneOperator} */
  MULTIPLICATION_OPERATORS = Object.freeze(['*', '/', '÷', "mod", "rem"]),
  /**
   * `a == b != c` is equivalent to `(a == b) and (b != c)`
   * @type {AtLeastOneOperator}
   */
  EQUALITY_OPERATORS = Object.freeze(["==", "!=", '≠']),
  /**
   * `a < b <= c` is equivalent to `(a < b) and (b <= c)`
   * @type {AtLeastOneOperator}
   */
  LESS_THAN_OPERATORS = Object.freeze(['<', "<=", '≤']),
  /**
   * `a > b >= c` is equivalent to `(a > b) and (b >= c)`
   * @type {AtLeastOneOperator}
   */
  GREATER_THAN_OPERATORS = Object.freeze(['>', ">=", '≥']),
  /**
   * `a > b >= c` is equivalent to `(a > b) and (b >= c)`
   * @type {AtLeastOneOperator}
   */
  SUBSET_OPERATORS = Object.freeze(['⊂', '⊆']),
  /**
   * `a > b >= c` is equivalent to `(a > b) and (b >= c)`
   * @type {AtLeastOneOperator}
   */
  SUPERSET_OPERATORS = Object.freeze(['⊃', '⊇']);

const MATH_OPERATORS = Object.freeze(ADDITION_OPERATORS.concat(MULTIPLICATION_OPERATORS));
  
/** @type {{readonly [Operator in DustOperator]: AtLeastOneOperator} & {__proto__: null}} */
const COMPATIBLE_OPERATORS = {
  __proto__: null,
  '+': ADDITION_OPERATORS,
  '-': ADDITION_OPERATORS,
  '*': MULTIPLICATION_OPERATORS,
  '/': MULTIPLICATION_OPERATORS,
  '÷': MULTIPLICATION_OPERATORS,
  "mod": MULTIPLICATION_OPERATORS,
  "rem": MULTIPLICATION_OPERATORS,
  '^': Object.freeze(['^']),
  "and": Object.freeze(["and"]),
  "or": Object.freeze(["or"]),
  "xor": Object.freeze(["xor"]),
  "not": Object.freeze(["not"]),
  "==": EQUALITY_OPERATORS,
  "!=": EQUALITY_OPERATORS,
  '≠': EQUALITY_OPERATORS,
  '<': LESS_THAN_OPERATORS,
  "<=": LESS_THAN_OPERATORS,
  '≤': LESS_THAN_OPERATORS,
  '>': GREATER_THAN_OPERATORS,
  ">=": GREATER_THAN_OPERATORS,
  '≥': GREATER_THAN_OPERATORS,
  "<:": Object.freeze(["<:"]),
  ":>": Object.freeze([":>"]),
  '⊂': SUBSET_OPERATORS,
  '⊆': SUBSET_OPERATORS,
  '⊃': SUPERSET_OPERATORS,
  '⊇': SUPERSET_OPERATORS,
  "++": Object.freeze(["++"]),
};
Object.freeze(COMPATIBLE_OPERATORS);

/** @import {DustNode, DustFunctionOrOperator, DustOperator, DustGap, ParseState, DustError, DustKeywordNodeMap} from "../types.d.ts" */

/**
 * @param {ParseState} state
 * @param {DustGap[]} gaps 
 * @param {DustNode[]} nodes
 * @returns {DustNode}
 */
const createGroupsForChainedFunctionCalls = (state, gaps, nodes) => {
  let 
    /** @type {DustFunctionOrOperator | DustKeywordNodeMap['λ'] | undefined} */
    firstFunctionOrOperator,
    /** @type {readonly DustOperator[]} */
    allowedOperators = EMPTY_ARRAY,
    index = 0;
  while (index < nodes.length) {
    const node = nodes[index];
    switch (node.type) {
      // @ts-expect-error: fall through to next case
      case "keyword":
        if (node.text !== 'λ') {
          addError(state, node, {message: `Keyword "${node.text}" not allowed here`});
          index++;
          continue;
        }
      case "function_called":
        if (!firstFunctionOrOperator) {
          firstFunctionOrOperator = node;
          index++;
          continue;
        }
        if (firstFunctionOrOperator.type !== "function_called") {
          addOperatorMixedWithFunctionError(state, firstFunctionOrOperator, node);
          index++;
          continue;
        }
        break;
      case "operator":
        if (!firstFunctionOrOperator) {
          firstFunctionOrOperator = node;
          allowedOperators = COMPATIBLE_OPERATORS[node.text];
          index++;
          continue;
        }
        if (firstFunctionOrOperator.type !== "operator") {
          addOperatorMixedWithFunctionError(state, firstFunctionOrOperator, node);
          index++;
          continue;
        }
        if (allowedOperators.includes(node.text)) {
          break;
        }
        const error = {
          message: `Mixing '${firstFunctionOrOperator.text}' and '${node.text}' together without parentheses is not allowed: Dust does not have operator precedence rules, because the order of operations can be confusing${
            MATH_OPERATORS.includes(node.text)
            ? " (PEMDAS is not enough to cover all cases for math operators, let alone comparison and logical ones)"
            : ""
          }. Please add parentheses to clarify the order of operations.\n(NOTE: ${
            (allowedOperators.length > 1)
            ? `Operators compatible with '${firstFunctionOrOperator.text}' are [${allowedOperators.join(", ")}]`
            : `'${firstFunctionOrOperator.text}' is only compatible with itself`
          })`,
        };
        addError(state, firstFunctionOrOperator, error);
        addError(state, node, error);
        break;
      default:
        index++;
        continue;
    }
    splice(
      gaps, nodes, 0, index,
      groupNode("function_call", sliceSubGroupGaps(gaps, 0, index), nodes.slice(0, index)),
    );
    index = 2;
    firstFunctionOrOperator = node;
  }
  const node = groupNode("function_call", gaps, nodes);
  if (!firstFunctionOrOperator) {
    addError(state, node, {
      message: `Expected at least one operator or function, but found only [${nodes.map(nodeInfo).join(", ")}]. (NOTE: a function value must be called with the '.' symbol, so "a .fn b" works but "a fn b" is an error)`
    });
  }
  return node;
};

/**
 * @param {DustNode} node 
 * @returns {string}
 */
const nodeInfo = (node) => {
  if (!isLeaf(node)) {
    return node.type;
  }
  const text = (node.text.length === 1) ? `'${node.text}'` : `"${node.text}"`;
  if (node.type === node.text) {
    return text;
  }
  return `${node.type}:${text}`;
};

/**
 * @param {ParseState} state
 * @param {DustNode} node1
 * @param {DustNode} node2
 */
const addOperatorMixedWithFunctionError = (state, node1, node2) => {
  operatorMixedWithFunctionError ??= {
    message: `Mixing operators and non-operator function calls together without parentheses is not allowed, because the order of operations is ambiguous. Please add parentheses to clarify the order of operations.`,
  };
  addError(state, node1, operatorMixedWithFunctionError);
  addError(state, node2, operatorMixedWithFunctionError);
};

/**

 * @param {DustGap[]} gaps
 * @param {DustNode[]} nodes 
 * @param {number} startInclusive 
 * @param {number} endExclusive 
 * @returns {void}
 */
const condenseGroupPart = (state, gaps, nodes, startInclusive, endExclusive) => {
  if (startInclusive > endExclusive) {
    panic(`invalid arguments to postProcessGroupSlice startInclusive=${startInclusive}, endExclusive=${endExclusive}, len=${nodes.length}`);
  }
  if (((startInclusive + 1) >= endExclusive) || (nodes.length < 2)) {
    return;
  }
  // Example:
  // startInclusive = 1, endExclusive = 3
  // nodes:     [ a,      b, c,     d,   ... ],
  // gaps:      [0,   1,    2, 3,     4, ...]
  // new nodes: [ a,    [ b, c, ],  d, ... ]
  // new gaps:  [0,  1, [x, 2, y], 3  4, ...] // x and y are new, both just ""
  splice(
    gaps, nodes, startInclusive, endExclusive - startInclusive,
    postProcessGroupPart(
      state,
      sliceSubGroupGaps(gaps, startInclusive, endExclusive),
      nodes.slice(startInclusive, endExclusive),
      null,
    ),
  );
};

const
  MILLISECONDS_PER_MINUTE = 1000 * 60,
  MILLISECONDS_PER_HOUR = MILLISECONDS_PER_MINUTE * 60;

/**
 * 
 * @param {number} milliseconds 
 * @returns {string}
 */
const millisecondsToHoursMinutesSeconds = (milliseconds) => {
  const
    remainingMsAfterHours = milliseconds % MILLISECONDS_PER_HOUR,
    remainingMsAfterMinutes = remainingMsAfterHours % MILLISECONDS_PER_MINUTE;

  return `${
    String(Math.floor(milliseconds / MILLISECONDS_PER_HOUR)).padStart(2, '0')
  }:${
    String(Math.floor(remainingMsAfterHours / MILLISECONDS_PER_MINUTE)).padStart(2, '0')
  }:${
    String(Math.floor(remainingMsAfterMinutes / 1000)).padStart(2, '0')
  }:${
    String(Math.floor(remainingMsAfterMinutes % 1000)).padStart(3, '0')
  }`;
};

/**
 * 
 * @param {number} milliseconds 
 * @returns {string}
 */
const millisecondsToReadableString = (milliseconds) => {
  const seconds = milliseconds / 1000;
  if (seconds < 1) {
    return `${milliseconds.toFixed(2)}ms`;
  }
  const minutes = seconds / 60;
  if (minutes < 1) {
    return `${seconds.toFixed(2)}s`;
  }
  return `${(minutes / 60).toFixed(2)}hrs`;
};

/** @import { DustCommentNode, DustNode, DustGap, DustErrorMap, DustError, DustGapStringWithError } from "../../parser/types.d.ts" */
/** @import { VirtualHTMLLeafNode } from "./types.d.ts" */

/**
 * 
 * @param {DustNode} node
 * @param {DustErrorMap | null} errorsMap
 * @returns {VirtualHTMLLeafNode[]}
 */
const dustNodeToVirtualHTML = (node, errorsMap) => {
  /** @type {VirtualHTMLLeafNode[]} */
  const result = [];
  addVirtualNodes(result, node, "", errorsMap, undefined);
  return result;
};

/**
 * 
 * @param {VirtualHTMLLeafNode[]} result 
 * @param {DustNode} node 
 * @param {string} containerClassName
 * @param {DustErrorMap | null} errorsMap
 * @param {readonly DustError[] | undefined} ancestorErrors
 */
const addVirtualNodes = (result, node, containerClassName, errorsMap, ancestorErrors) => {
  // TODO `baseClassName` should be an immutable set of container types to avoid duplication

  // TODO make separate versions of the function, one which has a non-nullable errorsMap, and another which has no errorsMap at all. It wastes work to check in every single function call in a potentially large AST.
  const allErrors = getAllErrors(node, errorsMap, ancestorErrors);

  if (isLeaf(node)) {
    /** @type {string} */
    let className = node.type;

    switch (className) { // TODO: should these just be the node.type to begin with?
      case '$':
        className = "dollar_sign";
        break;
      case ':':
        className = "colon";
        break;
      case '=':
        className = "equal_sign";
        break;
      case '.':
        className = "period";
        break;
    }
    result.push([`${containerClassName} ${className}`, allErrors ? makeErrorTitle(allErrors) : null, node.text]);
    return;
  }

  const
    className = node.type,
    children = node.children,
    gaps = node.text;
  let i;
  for (i = 0; i < children.length; i++) {
    addGap(result, gaps[i], className, errorsMap, allErrors);
    addVirtualNodes(result, children[i], className, errorsMap, allErrors);
  }
  addGap(result, gaps[i], className, errorsMap, allErrors);
};

/**
 * @param {VirtualHTMLLeafNode[]} result
 * @param {DustGap} gap
 * @param {string} containerClassName
 * @param {DustErrorMap | null} errorsMap
 * @param {readonly DustError[] | undefined} ancestorErrors
 * @returns {void}
 */
const addGap = (result, gap, containerClassName, errorsMap, ancestorErrors) => {
  if (typeof gap === "string") {
    if (gap === "") {
      return;
    }
    result.push([`${containerClassName} gap`, ancestorErrors ? makeErrorTitle(ancestorErrors) : null, gap]);
  } else if (Array.isArray(gap)) {
    for (const node of gap) {
      addCommentOrErrorGap(result, node, containerClassName, errorsMap, ancestorErrors);
    }
  } else {
    addCommentOrErrorGap(result, gap, containerClassName, errorsMap, ancestorErrors);
  }
};

/**
 * @param {VirtualHTMLLeafNode[]} result
 * @param {DustCommentNode | DustGapStringWithError} node
 * @param {string} containerClassName
 * @param {DustErrorMap | null} errorsMap
 * @param {readonly DustError[] | undefined} ancestorErrors
 * @returns {void}
 */
const addCommentOrErrorGap = (result, node, containerClassName, errorsMap, ancestorErrors) => {
  const
    allErrors = getAllErrors(node, errorsMap, ancestorErrors),
    errorTitle = allErrors ? makeErrorTitle(allErrors) : null;
  switch (node.type) {
    case "block_comment":
      addBlockComment(result, node, errorTitle, errorsMap, allErrors);
      break;
    case "line_comment":
      result.push([node.type, errorTitle, node.before]);
      pushIfNotEmpty(result, `${node.type} text`, errorTitle, node.data);
      pushIfNotEmpty(result, node.type, null, node.after);
      break;
    default: {
      const className = `${containerClassName} gap`;
      pushIfNotEmpty(result, className, null, node.before);
      result.push([className, errorTitle, node.data]);
      pushIfNotEmpty(result, className, null, node.after);
    }
  }
};

/** @type {(result: VirtualHTMLLeafNode[], ...rest: VirtualHTMLLeafNode) => void} */

/**
 * 
 * @param {VirtualHTMLLeafNode[]} result 
 * @param {string} className 
 * @param {string | null} errorTitle 
 * @param {string} text 
 * @returns 
 */
const pushIfNotEmpty = (result, className, errorTitle, text) => {
  if (text === "") {
    return;
  }
  result.push([className, errorTitle, text]);
};

/**
 * 
 * @param {VirtualHTMLLeafNode[]} result 
 * @param {DustCommentNode<"block_comment">} comment
 * @param {string | null} errorTitle
 * @param {DustErrorMap | null} errorsMap
 * @param {readonly DustError[] | undefined} ancestorErrors
 */
const addBlockComment = (result, comment, errorTitle, errorsMap, ancestorErrors) => {
  const
    className = comment.type,
    contentsClassName = `${className} text`;
  result.push([className, errorTitle, comment.before]);
  for (const child of comment.data) {
    if (typeof child === "string") {
      pushIfNotEmpty(result, contentsClassName, errorTitle, child);
      continue;
    }
    const // TODO add helper function for this, and move this out of the loop and remove errorTitle from params
      allErrors = getAllErrors(child, errorsMap, ancestorErrors),
      childErrorTitle = allErrors ? makeErrorTitle(allErrors) : null;
    addBlockComment(result, child, childErrorTitle, errorsMap, allErrors);
  }
  pushIfNotEmpty(result, className, errorTitle, comment.after);
};

/**
 * @param {DustNode | DustCommentNode | DustGapStringWithError} node
 * @param {DustErrorMap | null} errorsMap 
 * @param {readonly DustError[] | undefined} ancestorErrors
 * @returns {readonly DustError[] | undefined}
 */
const getAllErrors = (node, errorsMap, ancestorErrors) => {
  const ownErrors = errorsMap?.get(node);
  return (ancestorErrors && ownErrors)
    ? ancestorErrors.concat(ownErrors)
    : (ancestorErrors ?? ownErrors);
};

/**
 * 
 * @param {readonly DustError[]} errors
 * @returns {string | null}
 */
const makeErrorTitle = (errors) => {
  if (errors.length === 1) {
    return "Error:\n" + errors[0].message;
  } else {
    return "Errors:\n- " + errors.map(it => it.message).join("\n- ");
  }
};

/**
 * 
 * @param {DustNode} node
 * @returns {string}
 */
const nodeToString = (node) => {
  /** @type {string[]} */
  const strings = [];
  appendNode(strings, node);
  return strings.join("");
};

/**
 * 
 * @param {string[]} strings 
 * @param {DustNode} node 
 */
const appendNode = (strings, node) => {
  if (isLeaf(node)) {
    strings.push(node.text);
    return;
  }
  const children = node.children, gaps = node.text;
  let i;
  for (i = 0; i < children.length; i++) {
    appendGap(strings, gaps[i]);
    appendNode(strings, children[i]);
  }
  appendGap(strings, gaps[i]);
};



/**
 * @param {string[]} strings 
 * @param {DustGap} gap
 * @returns {void}
 */
const appendGap = (strings, gap) => {
  if (typeof gap === "string") {
    strings.push(gap);
    return;
  }
  if (Array.isArray(gap)) {
    for (const node of gap) {
      appendGapNode(strings, node);
    }
    return;
  }
  appendGapNode(strings, gap);
};

/**
 * @param {string[]} strings 
 * @param {DustCommentNode | DustGapStringWithError} gap
 * @returns {void}
 */
const appendGapNode = (strings, gap) => {
  if (gap.type === "block_comment") {
    appendBlockComment(strings, gap);
    return;
  }
  strings.push(gap.before, gap.data, gap.after);
};

/**
 * 
 * @param {string[]} strings 
 * @param {DustCommentNode<"block_comment">} comment
 */
const appendBlockComment = (strings, comment) => {
  strings.push(comment.before);
  for (const child of comment.data) {
    if (typeof child === "string") {
      strings.push(child);
    } else {
      appendBlockComment(strings, child);
    }
  }
  strings.push(comment.after);
};

/**
 * 
 * @param {DustGroupNode<"definition">} node 
 * @returns {string | null}
 */
const definitionName = (node) => {
  const patternNode = definitionPattern(node);
  switch (patternNode.type) {
    case "identifier_declaration": 
      return identifierDeclarationName(patternNode);
    case "variable_declaration":
      return identifierDeclarationName(patternNode.children[1]); // TODO add accessor
    case "set_declaration": 
      return patternNode.children[1].text; // TODO add accessor
    case "function_call": {
      const children = patternNode.children;
      for (let index = 0; index < children.length; index++) {
        const child = children[index];
        if (child.type !== "function_called") {
          continue;
        }
        const fnNode = child.children[1];
        if (fnNode.type !== "identifier_declaration") {
          // TODO needs parse error, e.g.: (foo.bar = baz)
          console.error(`Expected a function identifier declaration, but found "${fnNode.type}"`, node, nodeToString(node), child, nodeToString(child));
          return null;
        }
        return identifierDeclarationName(fnNode);
      }
      return null;
    }
    case "unparseable_group":
      return null;
    default:
      console.error(`"${patternNode.type}" patterns are not (yet) supported`, node, nodeToString(node));
      return null;
  }
};

/**
 * 
 * @param {DustGroupNode} node 
 * @returns {boolean}
 */
const isParenthesized = (node) => {
  const firstGap = node.text[0];
  if (typeof firstGap === "string") {
    return firstGap.startsWith('(');
  }
  if (Array.isArray(firstGap)) {
    return firstGap[0].before.startsWith('(');
  }
  return firstGap.before.startsWith('(');
};

/**

const drawSVGs = (lines, program, style) => {
  const 
    characterWidth = style.characterWidth,
    /** @type {VirtualSVGShape[]} */
    shapes = [];
  drawGroupOutlines(
    {
      shapes,
      lines,
      position: {row: 0, column: 0},
      controlFlowStack: [],
      fontSize: style.fontSize,
      lineHeight: style.lineHeight,
      characterWidth,
      tickLength: characterWidth / 3,

};

/**
 * @param {SVGContext} context
 * @param {DustGroupNode} node 
 * @param {number} depth
 * @returns {void}
 */
const drawGroupOutlines = (context, node, depth) => {
  if (node.type === "array") {
    drawArrayOutlines(context, node, depth);
    return;
  }
  const
    {position, controlFlowStack, characterWidth, lineHeight} = context,
    {children, text: gaps} = node,
    {row: startRow, column: startColumn} = position;
  let
    i = 0,
    /** @type {string | null} */
    label = null;
  switch (node.type) {
    case "definition":
      label = definitionName(node);
      break;
    case "loop":
    case "for_loop":
    case "while_loop":
    case "do_while_loop":
    case "do_expression":
      label = "";
      break;
    case "do_expression_with_label":
    case "do_while_loop_with_label":
    case "loop_with_label":
      label = blockOrLoopLabel(node);
      break;
    case "while_loop_with_label":
      label = whileLoopLabel(node);
      break;
    case "for_loop_with_label":
      label = forLoopLabel(node);
      break;
  }
  if (label !== null) {
    controlFlowStack.push({ label, outlineDepth: depth, arrows: [] });
  }
  for (; i < children.length; i++) {
    updatePositionForGap(position, gaps[i]);
    const child = children[i];
    if (isLeaf(child)) {
      updatePositionForString(position, child.text);
    } else {
      drawGroupOutlines(context, child, depth + 1);
    }
  }
  updatePositionForGap(position, gaps[i]);

  switch (node.type) {
    case "unparseable_group":
    case "program":
    case "identifier_declaration":
    case "function_called":
    case "definition_group":
      return;
    case "unit":
      // TODO add an outline/icon for unit
      return;
    case "parenthesized_value":
    case "set_declaration":
    case "write_declaration":
      // TODO add outlines/styles for some/all of these
      return;
    case "character_literal":
    case "string":
    case "fancy_string":
    case "french_string":
      // TODO add some background/outline style, maybe something like a sticky note.
      return;
    case "in_expression":
    case "function_call": {
      if (!isParenthesized(node)) {
        return; // Don't draw backgrounds/outlines for non-parenthesized function calls.
      }
      const endRow = position.row;
      context.shapes.push([
        "rect",
        node.type,
        colorIndex(context, depth),
        outlineStartX(startColumn, characterWidth) - (LINE_THICKNESS*2),
        outlineStartY(startRow, lineHeight, depth),
        outlineWidth(startColumn, characterWidth, findMaxWidth(context.lines, startRow, endRow, position.column)) + (LINE_THICKNESS * 4),
        outlineHeight(startRow, endRow, lineHeight, depth),
        Math.max(0, (lineHeight - depth + 1) / 2),
      ]);
      return;
    }
    case "variable_declaration":
      if (!isParenthesized(node)) {
        return; // Don't draw backgrounds/outlines for non-parenthesized function calls.
      }
      break;
  }
  const
    endRow = position.row,
    startX = outlineStartX(startColumn, characterWidth),
    startY = outlineStartY(startRow, lineHeight, depth),
    width = outlineWidth(startColumn, characterWidth, findMaxWidth(context.lines, startRow, endRow, position.column)),
    height = outlineHeight(startRow, endRow, lineHeight, depth);
  switch (node.type) {
    case "record": {
      const
        radius = RECORD_CORNER_RADIUS,

 * 
 * @param {SVGContext} context 
 * @param {number} depth 
 * @returns {number}

/**
 * @param {SVGContext} context
 * @param {number} depth
 * @returns {number}
 */
const cornerRadius = (context, depth) => Math.max(0, (context.fontSize - depth + 1) / 2);

/**
 * @param {SVGContext} context
 * @param {DustGroupNode<"array">} node 
 * @param {number} depth
 */
const drawArrayOutlines = (context, node, depth) => {
  const
    {position, characterWidth, lineHeight} = context,
    {children, text: gaps} = node,
    {row: startRow, column: startColumn} = position,
    /** @type {number[]} */
    rows = [],
    /** @type {number[]} */
    columns = [];
  updatePositionForGap(position, gaps[0]);
  for (let i = 0; i < children.length; i++) {
    const child = children[i];
    if (isLeaf(child)) {
      updatePositionForString(position, child.text);
    } else {
      drawGroupOutlines(context, child, depth + 1);
    }
    updatePositionForGap(position, gaps[i + 1]);
    // TODO: gap might "belong" to the previous or next child, so may need to push a row/column somewhere in between
    rows.push(position.row);
    columns.push(position.column);
  }
  const
    endRow = position.row,
    width = outlineWidth(startColumn, characterWidth, findMaxWidth(context.lines, startRow, endRow, position.column)),
    startX = outlineStartX(startColumn, characterWidth),
    verticalLineOffset = (LINE_THICKNESS * depth * 2);
  let
    path = rectangle(
      startX, outlineStartY(startRow, lineHeight, depth),
      width, outlineHeight(startRow, endRow, lineHeight, depth),
    ),
    lastDividerRow = startRow;
  for (let i = 0; i < (children.length - 1); i++) {
    const row = rows[i];
    if (row === lastDividerRow) {
      // vertical line
      const
        x = (columns[i] * characterWidth) - (characterWidth / 2),
        y = (row * lineHeight) + OFFSET_TOP + (verticalLineOffset / 2);
      path += ` M ${x},${y - (verticalLineOffset / 2 * +(row !== startRow))} V ${y + (verticalLineOffset / 2 * +(row !== endRow)) + lineHeight - verticalLineOffset}`;
    } else {
      // horizontal line
      path += ` M ${startX},${(row * lineHeight) + OFFSET_TOP} h ${width}`;
      lastDividerRow = row;
    }
  }
  context.shapes.push(["path", "array", colorIndex(context, depth), path]);
};

/**
 * @param {DustNodeType} nodeType
 * @param {SVGContext} context
 * @param {number} startX 
 * @param {number} startY 
 * @param {number} width 
 * @param {number} height 
 * @param {number} depth
 * @param {ControlFlowBlock | undefined} block 
 */
const drawControlFlowOutline = (nodeType, context, startX, startY, width, height, depth, block) => {
  const radius = cornerRadius(context, depth);
  if (block) {
    block.arrows.push({ sourceLeft: startX, sourceTop: startY, cornerRadius: radius });
    depth = block.outlineDepth;
  }
  context.shapes.push([
    "path",
    nodeType,
    colorIndex(context, depth),
    chamferedRectangle(startX, startY, width, height, radius),
  ]);

/**
 * @param {string} path
 * @param {SVGContext} context 
 * @param {readonly ControlFlowArrow[]} arrows 
 * @param {number} startX 
 * @param {number} startY
 * @returns {string}
 */
const drawControlFlowArrows = (path, context, arrows, startX, startY) => {
  const
    arrowTipX = startX + (LINE_THICKNESS / 2),
    arrowX = 5,
    arrowY = 3;
  for (const arrow of arrows) {
    const
      arrowTop = arrow.sourceTop,
      halfRadius = arrow.cornerRadius / 2;
    if ((arrowTop - startY) < context.lineHeight) {
      // For now, don't draw arrows if the source is on the first line of the block
      // TODO try something like an arrow to the top edge
      continue;
    }
    path += ` M ${arrow.sourceLeft + halfRadius},${arrowTop + halfRadius} L ${arrow.sourceLeft},${arrowTop} L ${arrowTipX},${arrowTop} M ${arrowTipX + arrowX},${arrowTop - arrowY} L ${arrowTipX},${arrowTop} L ${arrowTipX + arrowX},${arrowTop + arrowY}`;
  }
  return path;
};


/**
 * 
 * @param {readonly string[]} lines 
 * @param {number} startRow 
 * @param {number} endRow 
 * @param {number} endColumn
 * @returns {number}
 */
const findMaxWidth = (lines, startRow, endRow, endColumn) => {
  let maxWidthExceptLastLine = 0;
  for (let i = startRow; i < endRow; i++) {
    if (lines[i].length > maxWidthExceptLastLine) {
      maxWidthExceptLastLine = lines[i].length;
    }
  }
  // For multi-line groups, give a little space between the outline and the end of the longest line
  maxWidthExceptLastLine++;
  return Math.max(maxWidthExceptLastLine, endColumn);
};

/**
 * @param {number} startColumn 
 * @param {number} characterWidth 
 * @returns {number}
 */
const outlineStartX = (startColumn, characterWidth) =>
  (startColumn * characterWidth) + (LINE_THICKNESS / 2) + (characterWidth / 2);

/**
 * @param {number} startRow 
 * @param {number} lineHeight
 * @param {number} depth
 * @returns {number}
 */
const outlineStartY = (startRow, lineHeight, depth) =>
  (startRow * lineHeight) + (LINE_THICKNESS * depth) + OFFSET_TOP;

/**
 * @param {number} startColumn 
 * @param {number} characterWidth
 * @param {number} maxWidth
 * @returns {number}
 */
const outlineWidth = (startColumn, characterWidth, maxWidth) =>
  ((maxWidth - startColumn - 1) * characterWidth) - LINE_THICKNESS;

/**
 * @param {number} startRow 
 * @param {number} endRow
 * @param {number} lineHeight
 * @param {number} depth
 * @returns {number}
 */
const outlineHeight = (startRow, endRow, lineHeight, depth) =>
  Math.max(0, ((endRow + 1 - startRow) * lineHeight) - (LINE_THICKNESS * depth * 2));

  setAttributeIfChanged(state.results.firstChild, "title", LINE_NUMBERS_CLICKABLE_TITLE);
  setPropertyIfChanged(state.results.firstChild.style, "cursor", "pointer");
  const

  programLineNumber.title += title;

  // TODO figure out a better way to handle multiple results on a single line...
  programLineNumber.firstElementChild?.remove();

    return;

  state.results.firstChild.title = "Program changed since this result was displayed"; // TODO better message.
  state.results.firstChild.style.cursor = "default";

  for (const line of state.lineNumberElementsWithResults) {
    line.removeAttribute("title");
    line.firstElementChild?.remove();
  }

  state.programRowToResultRow.clear();

/** @import {DustNode, DustGroupNode} from "../types.d.ts" */

/**
 * 
 * @param {DustGroupNode<"if_expression">} node 
 * @returns {number}
 */
const getThenBranchCount = (node) => {
  const children = node.children;
  // (if <condition> then <branch>) ==> nodes = 4, count = 1
  // (if <condition1> then <branch1> if <condition2> then <branch2>) ==> nodes = 8, count = 2
  if (hasElseBranch(children)) {
    return (children.length - 2) / 4;
  }
  return children.length / 4;
};

/**
 * 
 * @param {DustGroupNode<"if_expression">} node 
 * @param {number} thenBranchIndex
 * @returns {DustNode} 
 */
const getCondition = (node, thenBranchIndex) =>
  // (if <condition> then <branch>) ==> branchIndex = 0, childIndex = 1
  // (if <condition1> then <branch1> if <condition2> then <branch2>) ==> branchIndex = 1, childIndex = 5
  node.children[(thenBranchIndex * 4) + 1];

/**
 * 
 * @param {DustGroupNode<"if_expression">} node 
 * @param {number} thenBranchIndex
 * @returns {DustNode} 
 */
const getThenBranch = (node, thenBranchIndex) =>
  // (if <condition> then <branch>) ==> branchIndex = 0, childIndex = 3
  // (if <condition1> then <branch1> if <condition2> then <branch2>) ==> branchIndex = 1, childIndex = 7
  node.children[(thenBranchIndex * 4) + 3];


/**
 * 
 * @param {DustGroupNode<"if_expression">} node 
 * @returns {DustNode | null} 
 */
const getElseBranch = (node) => {
  const children = node.children;
  if (hasElseBranch(children)) {
    return children[children.length - 1];
  }
  return null;
};

/**
 * 
 * @param {DustGroupNode<"if_expression">["children"]} children 
 * @returns {boolean}
 */
const hasElseBranch = (children) => 
  isKeyword(children[children.length - 2], "else");

/** @import { DustArray, DustAssociatedFunction, DustFunction, DustRecord, DustRecordType, DustValue, DustValueType } from "./interpreter-types.d.ts" */

/**
 * @type {DustFunction}
 * @param {DustValue} value 
 * @returns {string}
 */
const dustValueType = (value) => {
  if (value === null) {
    return "null";
  }
  if (Array.isArray(value)) {
    return "array";
  }
  if (typeof value === "object") {
    return "record";
  }
  return typeof value;
};
// TODO: change this to something like "type-name": "type" should return a record with all the specific type information: accessors for fields, associated functions, etc
dustValueType.dustFunctionName = "type";

/**
 * @type {Map<string, DustRecordType>}
 */
const recordTypes = new Map();

// TODO expose these types to the language somehow, enabling e.g.:
// Number.apply, Text.to-uppercase, MyRecord.field-name

/** @type {DustValueType<null>} */
const null_TYPE = {
  name: "null", // TODO rename to "Null"
  category: "null",
  associatedFunctions: { __proto__: null },
};

/** @type {DustValueType<boolean>} */
const boolean_TYPE = {
  name: "boolean", // TODO rename to "Boolean"
  category: "boolean",
  associatedFunctions: { __proto__: null },
};

/** @type {DustValueType<number>} */
const number_TYPE = {
  name: "number", // TODO rename to "Number"
  category: "number",
  associatedFunctions: {
    __proto__: null,
    // Shorthand for ".at", e.g.: [0, 1, 2].2 or [0, 1, 2].-1
    apply: (self, collection) => {
      if (!Array.isArray(collection)) {
        // TODO should this check fields for an override first?
        const at = getType(collection).associatedFunctions.at;
        if (at) {
          return at.call(collection, self);
        }
        throw new InterpretError(\`"\${dustValueType(collection)}" does not support integer offsets\`, { node: null, scope: null });
      }
      const value = collection.at(self);
      if (value === undefined) {
        throw new InterpretError(...offsetOutOfBoundsErrorArgs(self, collection));
      }
      return value;
    },

    rounded: (self) => Math.round(self),

    ["to-fixed"]: (self, fractionDigits) => {
      if (typeof fractionDigits !== "number") {
        throw new InterpretError(\`Expected a number after "to-fixed" but got \${dustValueType(fractionDigits)}\`,  { node: null, scope: null })
      }
      return self.toFixed(fractionDigits);
    }
  },
};


/** @type {DustValueType<DustFunction>} */
const function_TYPE = {
  name: "DustFunction",
  category: "function",
  associatedFunctions: {
    __proto__: null,
    apply: (self, ...args) => self.apply(args),
    name: (self) => self.dustFunctionName ?? self.name,
  },
};

/** @type {DustValueType<DustFunction>} */
const method_TYPE = {
  name: "DustMethod",
  category: "function",
  associatedFunctions: {
    __proto__: null,
    apply: (self, ...args) => self.apply(args),
    name: (self) => self.dustFunctionName ?? self.name,
  },
};


/** @type {DustValueType<string>} */
const string_TYPE = {
  name: "string", // TODO rename to "Text"
  category: "record",
  associatedFunctions: {
    __proto__: null,
    length: (self) => self.length,
    at: (self, offset) => {
      if (typeof offset !== "number") {
        throw new InterpretError(...offsetTypeErrorArgs(offset));
      }
      const value = self.at(offset);
      if (value === undefined) {
        return null;
      }
      return value;
    },
    require: (self, offset) => {
      if (typeof offset !== "number") {
        throw new InterpretError(...offsetTypeErrorArgs(offset));
      }
      const value = self.at(offset);
      if (value === undefined) {
        throw new InterpretError(...offsetOutOfBoundsErrorArgs(offset, self));
      }
      return value;
    },
    ["to-uppercase"]: (self) => self.toUpperCase(),
  },
};

/**
 * 
 * @param {DustValue} a 
 * @param {DustValue} b 
 * @returns {number}
 */
const defaultComparator = (a, b) => a - b;

/** @type {DustValueType<DustArray>} */
const array_TYPE = {
  name: "DustArray",
  category: "record",
  associatedFunctions: {
    __proto__: null,
    length: (self) => self.length,
    at: (self, offset) => {
      if (typeof offset !== "number") {
        throw new InterpretError(...offsetTypeErrorArgs(offset));
      }
      const value = self.at(offset);
      if (value === undefined) {
        return null;
      }
      return value;
    },
    require: (self, offset) => {
      if (typeof offset !== "number") {
        throw new InterpretError(...offsetTypeErrorArgs(offset));
      }
      const value = self.at(offset);
      if (value === undefined) {
        throw new InterpretError(...offsetOutOfBoundsErrorArgs(offset, self));
      }
      return value;
    },
    with: (self, offset, element) => {
      if (typeof offset !== "number") {
        throw new InterpretError(...offsetTypeErrorArgs(offset));
      }
      const length = self.length;
      if (offset < -length || length <= offset) {
        throw new InterpretError(...offsetOutOfBoundsErrorArgs(offset, self));
      }
      return self.with(offset, element);
    },
    ["set!"]: (self, offset, element) => {
      if (typeof offset !== "number") {
        throw new InterpretError(...offsetTypeErrorArgs(offset));
      }
      const length = self.length;
      if (offset < -length || length <= offset) {
        throw new InterpretError(...offsetOutOfBoundsErrorArgs(offset, self));
      }
      // TODO: check that the type of the new element is compatible!
      if (offset < 0) {
        self[offset + length] = element;
      } else {
        self[offset] = element;
      }
      return self;
    },
    // TODO with-all and set-all! to set multiple at once

    append: (self, element) => [...self, element],
    prepend: (self, element) => [element, ...self],
    ["append!"]: (self, element) => {
      // TODO: check that the type of the new element is compatible!
      self.push(element);
      return self;
    },
    ["prepend!"]: (self, element) => {
      // TODO: check that the type of the new element is compatible!
      self.unshift(element);
      return self;
    },

    ["append-all"]: (self, elements) => {
      if (!Array.isArray(elements)) {
        throw new InterpretError(\`"append-all" requires both parameters to be arrays, but got "\${dustValueType(self)}" and "\${dustValueType(elements)}"\`, { node: null, scope: null });
      }
      return [...self, ...elements];
    },
    ["prepend-all"]: (self, elements) => {
      if (!Array.isArray(elements)) {
        throw new InterpretError(\`"prepend-all" requires both parameters to be arrays, but got "\${dustValueType(self)}" and "\${dustValueType(elements)}"\`, { node: null, scope: null });
      }
      return [...elements, ...self];
    },
    ["append-all!"]: (self, elements) => {
      if (!Array.isArray(elements)) {
        throw new InterpretError(\`"append-all!" requires both parameters to be arrays, but got "\${dustValueType(self)}" and "\${dustValueType(elements)}"\`, { node: null, scope: null });
      }
      // TODO: check that the type of the new elements array is compatible!
      self.push(...elements);
      return self;
    },
    ["prepend-all!"]: (self, elements) => {
      if (!Array.isArray(elements)) {
        throw new InterpretError(\`"prepend-all!" requires both parameters to be arrays, but got "\${dustValueType(self)}" and "\${dustValueType(elements)}"\`, { node: null, scope: null });
      }
      // TODO: check that the type of the new elements array is compatible!
      self.unshift(...elements);
      return self;
    },

    sorted: (self) => self.toSorted(defaultComparator),
    ["sort!"]: (self) => self.sort(defaultComparator),
  },
};

/**
 * 
 * @param {DustValue} offset 
 * @returns {[string, any, ErrorOptions]} TODO: ConstructorParameters<InterpretError> doesn't work for some reason (it's "never")
 */
const offsetTypeErrorArgs = (offset) =>
  [\`Expected offset of type "number" but got "\${dustValueType(offset)}"\`, { node: null, scope: null }, { cause: offset }];

/**
 * 
 * @param {number} offset 
 * @param {{length: number}} collection 
 * @returns {[string, any, ErrorOptions]} TODO: ConstructorParameters<InterpretError> doesn't work for some reason (it's "never")
 */
const offsetOutOfBoundsErrorArgs = (offset, collection) =>
  [\`Offset \${offset} out of bounds of collection of length \${collection.length}\`, { node: null, scope: null }, { cause: collection }];


/** 
 * TODO 
 * - explain what this does and how it works
 * - should the interpreter use object prototype instead?
 */
const RECORD_TYPE_KEY = Symbol("type");

/** @type {DustAssociatedFunction<DustRecord>} */
const recordWith = (self, otherRecord) => {
  if (!isRecord(otherRecord)) {
    throw new InterpretError(\`"with" requires both parameters to be records, but got "\${dustValueType(otherRecord)}"\`, { node: null, scope: null }, { cause: { self, otherRecord } });
  }
  /** @type {DustRecord} */
  const result = {[RECORD_TYPE_KEY]: null};
  for (const key of Object.keys(self)) {
    if (Object.hasOwn(otherRecord, key)) {
      continue;
    }
    // SAFETY: \`key\` returned by Object.keys must have a PropertyDescriptor
    Object.defineProperty(result, key, /** @type {PropertyDescriptor} */(Object.getOwnPropertyDescriptor(self, key)));
  }
  for (const key of Object.keys(otherRecord)) {
    // SAFETY: \`key\` returned by Object.keys must have a PropertyDescriptor
    Object.defineProperty(result, key, /** @type {PropertyDescriptor} */(Object.getOwnPropertyDescriptor(otherRecord, key)));
  }
  return result;
};
recordWith.dustFunctionName = "with";

/** @type {DustAssociatedFunction<DustRecord>} */
const recordWithout = (self, fieldNames) => {
  if (!Array.isArray(fieldNames)) {
    throw new InterpretError(\`"without" requires the second parameter to be an array, but got "\${dustValueType(fieldNames)}"\`, { node: null, scope: null }, { cause: { self, fieldNames } });
  }
  /** @type {DustRecord} */
  const result = {[RECORD_TYPE_KEY]: null};
  for (const key of Object.keys(self)) {
    if (fieldNames.includes(key)) {
      continue;
    }
    // SAFETY: \`key\` returned by Object.keys must have a PropertyDescriptor
    Object.defineProperty(result, key, /** @type {PropertyDescriptor} */(Object.getOwnPropertyDescriptor(self, key)));
  }
  return result;
};
recordWithout.dustFunctionName = "without";

/** @type {DustAssociatedFunction<DustRecord>} */
const recordSet = (self, otherRecord) => {
  if (!isRecord(otherRecord)) {
    throw new InterpretError(\`"set!" requires both parameters to be records, but got "\${dustValueType(otherRecord)}"\`, { node: null, scope: null }, { cause: { self, otherRecord } });
  }
  for (const [fieldName, value] of Object.entries(otherRecord)) {
    const descriptor = Object.getOwnPropertyDescriptor(self, fieldName);
    if (!descriptor) {
      throw new InterpretError(\`target record does not have a field "\${fieldName}"\`, { node: null, scope: null }, { cause: { self, otherRecord } });
    }
    if (!descriptor.writable) {
      throw new InterpretError(\`Cannot set field "\${fieldName}" because it is a constant\`, { node: null, scope: null }, { cause: { self, otherRecord } });
    }
    self[fieldName] = value;
  }
  return self;
};
recordSet.dustFunctionName = "set!";

/**
 * 
 * @param {DustValue} value 
 * @returns {value is DustRecord}
 */
const isRecord = (value) => dustValueType(value) === "record";


/**
 * @template {DustValue} T
 * @param {T} value 
 * @returns {DustValueType<T>}
 */
const getType = (value) => {
  switch (typeof value) {
    case "string":
      return /** @type {DustValueType<T>} */(string_TYPE);
    case "boolean":
      return /** @type {DustValueType<T>} */(boolean_TYPE);
    case "number":
      return /** @type {DustValueType<T>} */(number_TYPE);
    // TODO: string, array, and record should probably be merged.
    case "function":
      if (value.takesSelf) {
        return /** @type {DustValueType<T>} */(method_TYPE);
      }
      return /** @type {DustValueType<T>} */(function_TYPE);
    case "object":
      if (value === null) {
        return /** @type {DustValueType<T>} */(null_TYPE);
      }
      if (Array.isArray(value)) {
        return /** @type {DustValueType<T>} */(array_TYPE);
      }
      let t = value[RECORD_TYPE_KEY];
      if (t) {
        return /** @type {DustValueType<T>} */(t);
      }
      const
        fieldTypeEntries =
          Object.entries(value).map(
            /** @returns {[String, DustValueType<DustValue>]} */
            ([k, v]) => [k, getType(v)]
          ),
        fieldTypes = Object.fromEntries(fieldTypeEntries),
        typeKey = JSON.stringify(fieldTypes); // TODO use immutable records if proposal gets implemented
      t = recordTypes.get(typeKey) ?? null;
      if (!t) {
        t = {
          name: "Record",
          category: "record",
          // TODO for records other than Arrays and Strings, it might make sense to store the associated functions record in the record's prototype for fast access.
          // TODO add a function "with" that returns a new record with the new values, making sure to update the typeKey value if needed!
          associatedFunctions: {
            __proto__: null,
            with: recordWith,
            without: recordWithout,
            ["set!"]: recordSet,
           },
          fieldTypes,
        };
        for (const [fieldName, fieldType] of fieldTypeEntries) {
          const fn = makeAssociatedFunction(fieldName, fieldType);
          fn.dustFunctionName = fieldName;
          t.associatedFunctions[fieldName] = fn;
        }
        recordTypes.set(typeKey, t);
        value[RECORD_TYPE_KEY] = t;
      }
      return /** @type {DustValueType<T>} */(t);
    default:
      throw new InterpretError(\`Unrecognized dust value type "\${typeof value}"\`, { node: null, scope: null });
  }
};

/**
 * 
 * @param {string} fieldName 
 * @param {DustValueType<DustValue>} fieldType 
 * @returns {DustAssociatedFunction<DustRecord>}
 */
const makeAssociatedFunction = (fieldName, fieldType) => {
  switch (fieldType) {
    case method_TYPE:
      return (self, ...args) => {
        const fn = self[fieldName];
        if (typeof fn !== "function") {
          throw new InterpretError(\`Expected record.\${fieldName} to be a function, but got "\${dustValueType(fn)}"\`, { node: null, scope: null }, { cause: { self } });
        }
        return fn(self, ...args); // TODO: might make sense for methods to use JS \`this\` so I can write fn.apply(self, args)
      };
    case function_TYPE:
      return (self, ...args) => {
        const fn = self[fieldName];
        if (typeof fn !== "function") {
          throw new InterpretError(\`Expected record.\${fieldName} to be a function, but got "\${dustValueType(fn)}"\`, { node: null, scope: null }, { cause: { self } });
        }
        return fn.apply(null, args);
      }
    default:
      return (self) => {
        const value = self[fieldName];
        if ((value === undefined) || (typeof value === "function")) {
          throw new InterpretError(\`Expected record.\${fieldName} to be a value that's not a function nor undefined, but got "\${dustValueType(value)}"\`, { node: null, scope: null }, { cause: { self } });
        }
        return value;
      };
  }
};
