      throw new InterpretError(\`Bug: unexpected "program" node that is not a root\`, { node, scope });
    case "integer_literal": {
      const result = parseIntSafe(node.text);
      if (isOk(result)) {
        return result;
      }
      let message;
      if (errCause(result) === PARSE_NUMBER_ERROR__OUT_OF_BOUNDS) {
        message = \`"\${node.text}" is not between \${Number.MIN_SAFE_INTEGER} and \${Number.MAX_SAFE_INTEGER} (inclusive)\`;
      } else {
        message = \`"\${node.text}" is not a valid integer literal\`;
      }
      throw new InterpretError(message, { node, scope });
    }
    case "decimal_literal": {
      const result = parseFloatSafe(node.text);
      if (isOk(result)) {
        return result;
      }
      let message;
      if (errCause(result) === PARSE_NUMBER_ERROR__OUT_OF_BOUNDS) {
        message = \`"\${node.text}" is not finite\`;
      } else {
        message = \`"\${node.text}" is not a valid floating point literal\`;
      }
      throw new InterpretError(message, { node, scope });
    }
    case "identifier": {
      const value = scope[node.text];
      if (value === undefined) {
        throw new InterpretError(\`"\${node.text}" not found in scope\`, { node, scope });
      }
      return value;
    }
    case "unit":
      throw new InterpretError(\`TODO: implement "\${node.type}"\`, { node, scope });
    case "parenthesized_value":
      return interpret(node.children[0], scope, definitionName, shouldStop);
    case "identifier_declaration":
    case "variable_declaration":
    case "set_declaration":
    case "write_declaration":
    case "typed_declaration":
      throw new InterpretError(\`Bug: unexpected "\${node.type}" node\`, { node, scope });
    case "definition":
      return interpretDefinitionOrAssignment(node, scope, scope, shouldStop);
    case "function_called":
      throw new InterpretError(\`Bug: unexpected "\${node.type}" node\`, { node, scope });
    case "function_call":
      return interpretFunctionCall(node, scope, shouldStop);
    case "if_expression": {
      const thenBranchCount = getThenBranchCount(node);
      for (let index = 0; index < thenBranchCount; index++) {
        const condition = interpret(getCondition(node, index), scope, null, shouldStop);
        if (isControlFlow(condition)) {
          return condition;
        }
        if (typeof condition !== "boolean") {
          throw new InterpretError(\`Expression between "if" and "then" must be of type "boolean", but got "\${dustValueType(condition)}"\`, { node: getCondition(node, index), scope });
        }
        if (condition) {
          return interpret(getThenBranch(node, index), scope, null, shouldStop);
        }
      }
      const elseBranchNode = getElseBranch(node);
      if (elseBranchNode) {
        return interpret(elseBranchNode, scope, null, shouldStop);
      }
      return null;
    }
    case "match_expression":
      throw new InterpretError(\`TODO: implement "\${node.type}"\`, { node, scope });
    case "in_expression":
      scope = Object.create(scope);
      for (const definition of getDefinitionGroup(node).children) {
        const value = interpretDefinitionOrAssignment(definition, scope, scope, shouldStop);
        if (isControlFlow(value)) {
          return value;
        }
      }
      return interpret(getInExpressionResult(node), scope, null, shouldStop);
    case "definition_group":
      throw new InterpretError(\`Bug: unexpected "\${node.type}" node\`, { node, scope });
    case "do_expression":
      return interpretDoExpression(node, scope, definitionName, 1, shouldStop);
    case "do_expression_with_label":
      return interpretDoExpression(node, scope, blockOrLoopLabel(node), 2, shouldStop);
    case "loop":
      return interpretUnconditionalLoop(node, scope, definitionName, 1, shouldStop);
    case "loop_with_label":
      return interpretUnconditionalLoop(node, scope, blockOrLoopLabel(node), 2, shouldStop);
    case "while_loop":
      return interpretWhileLoop(node, scope, definitionName, 3, shouldStop);
    case "while_loop_with_label":
      return interpretWhileLoop(node, scope, whileLoopLabel(node), 4, shouldStop);
    case "do_while_loop":
      return interpretDoWhileLoop(node, scope, definitionName, 1, shouldStop);
    case "do_while_loop_with_label":
      return interpretDoWhileLoop(node, scope, blockOrLoopLabel(node), 2, shouldStop);
    case "for_loop":
    case "for_loop_with_label":
      throw new InterpretError(\`TODO: implement "\${node.type}"\`, { node, scope });
    case "return_expression": {
      const valueNode = returnValue(node);
      if (!valueNode) {
        return returnControlFlow(null, null, node);
      }
      const value = interpret(valueNode, scope, null, shouldStop);
      if (isControlFlow(value)) {
        return value;
      }
      return returnControlFlow(value, null, node);
    }
    case "return_expression_with_label": {
      const valueNode = returnWithLabelValue(node);
      if (!valueNode) {
        return returnControlFlow(null, controlFlowLabel(node), node);
      }
      const value = interpret(valueNode, scope, null, shouldStop);
      if (isControlFlow(value)) {
        return value;
      }
      return returnControlFlow(value, controlFlowLabel(node), node);
    }
    case "continue_expression":
      return continueControlFlow(null, node);
    case "continue_expression_with_label":
      return continueControlFlow(controlFlowLabel(node), node);
    case "record":
      return interpretRecord(node, scope, shouldStop);
    case "array":
      return interpretArray(node, scope, shouldStop);
    case "character_literal":
      throw new InterpretError(\`TODO: implement "\${node.type}"\`, { node, scope });
    case "string":
    case "fancy_string":
    case "french_string":
      // The quotes for the outer string are not part of the string, hence the ""s.
      return interpretString(node, scope, "", "", shouldStop);
  }
};

/**
 * @param {DustGroupNode<"do_expression" | "do_expression_with_label">} node
 * @param {DustScope} scope
 * @param {string | null} blockLabel The name of the value or function definition, if this block is *directly* the part after the \`=\` of the definition.
 * @param {1 | 2} bodyStart
 * @param {(() => unknown) | undefined} shouldStop
 * @returns {DustValue | DustControlFlow}
 */
const interpretDoExpression = (node, scope, blockLabel, bodyStart, shouldStop) => {
  const children = node.children;
  scope = Object.create(scope);
  for (let i = bodyStart; i < children.length; i++) {
    const result = interpret(children[i], scope, null, shouldStop);
    if (!isControlFlow(result)) {
      continue;
    }
    const { kind, label, value } = result;
    if ((label !== null) && (label !== blockLabel)) {
      return result;
    }
    if (kind === CONTINUE) {
      // TODO parser should check this
      throw new InterpretError(\`Cannot "continue" from a block (tried to "continue" from "\${blockLabel}")\`, { node: result.node, scope });
    }
    return value;
  }
  return null;
};

/**
 * @param {DustGroupNode<"loop" | "loop_with_label">} node
 * @param {DustScope} scope
 * @param {string | null} blockLabel The name of the value or function definition, if this loop is *directly* the part after the \`=\` of the definition.
 * @param {1 | 2} bodyStart
 * @param {(() => unknown) | undefined} shouldStop
 * @returns {DustValue | DustControlFlow}
 */
const interpretUnconditionalLoop = (node, scope, blockLabel, bodyStart, shouldStop) => {
  const children = node.children;
  scope = Object.create(scope);
  while (true) {
    if (shouldStop?.()) {
      throw STOP;
    }
    for (let i = bodyStart; i < children.length; i++) {
      const result = interpret(children[i], scope, null, shouldStop);
      if (!isControlFlow(result)) {
        continue;
      }
      const { kind, label, value } = result;
      if ((label !== null) && (label !== blockLabel)) {
        return result;
      }
      if (kind === CONTINUE) {
        break;
      }
      return value;
    }
  }
};

/**
 * @param {DustGroupNode<"while_loop" | "while_loop_with_label">} node
 * @param {DustScope} scope
 * @param {string | null} blockLabel
 * @param {3 | 4} bodyStart
 * @param {(() => unknown) | undefined} shouldStop
 * @returns {DustValue | DustControlFlow}
 */
const interpretWhileLoop = (node, scope, blockLabel, bodyStart, shouldStop) => {
  scope = Object.create(scope);
  const
    children = node.children,
    conditionNode = children[1];
  while (true) {
    if (shouldStop?.()) {
      throw STOP;
    }
    const condition = interpret(conditionNode, scope, null, shouldStop);
    if (isControlFlow(condition)) {
      return condition;
    }
    if (typeof condition !== "boolean") {
      throw new InterpretError(\`Expression between "while" and "do" must be of type "boolean", got "\${dustValueType(condition)}"\`, { node: conditionNode, scope });
    }
    if (!condition) {
      return null; // TODO consider supporting something like "else" for this branch, to allow returning something other than \`null\`
    }
    for (let i = bodyStart; i < children.length; i++) {
      const result = interpret(children[i], scope, null, shouldStop);
      if (!isControlFlow(result)) {
        continue;
      }
      const { kind, label, value } = result;
      if ((label !== null) && (label !== blockLabel)) {
        return result;
      }
      if (kind === CONTINUE) {
        break;
      }
      return value;
    }
  }
};

/**
 * @param {DustGroupNode<"do_while_loop" | "do_while_loop_with_label">} node
 * @param {DustScope} scope
 * @param {string | null} blockLabel
 * @param {1 | 2} bodyStart
 * @param {(() => unknown) | undefined} shouldStop
 * @returns {DustValue | DustControlFlow}
 */
const interpretDoWhileLoop = (node, scope, blockLabel, bodyStart, shouldStop) => {
  scope = Object.create(scope);
  const
    children = node.children,
    whileKeywordIndex = children.length - 2,
    conditionNode = children[whileKeywordIndex + 1];
  while (true) {
    if (shouldStop?.()) {
      throw STOP;
    }
    for (let i = bodyStart; i < whileKeywordIndex; i++) {
      const result = interpret(children[i], scope, null, shouldStop);
      if (!isControlFlow(result)) {
        continue;
      }
      const { kind, label, value } = result;
      if ((label !== null) && (label !== blockLabel)) {
        return result;
      }
      if (kind === CONTINUE) {
        break;
      }
      return value;
    }
    const condition = interpret(conditionNode, scope, null, shouldStop);
    if (isControlFlow(condition)) {
      return condition;
    }
    if (typeof condition !== "boolean") {
      throw new InterpretError(\`Expression after "while" must be of type "boolean", got "\${dustValueType(condition)}"\`, { node: conditionNode, scope });
    }
    if (!condition) {
      return null; // TODO consider supporting something like "else" for this branch, to allow returning something other than \`null\`
    }
  }
};

/**
 * @param {DustGroupNode<"function_call">} node
 * @param {DustScope} scope
 * @param {(() => unknown) | undefined} shouldStop
 * @returns {DustValue | DustControlFlow}
 */
const interpretFunctionCall = (node, scope, shouldStop) => {
  if (shouldStop?.()) {
    throw STOP;
  }
  const
    children = node.children,
    /** @type {DustValue[]} */
    parameters = [];
  /** @type {DustFunction | undefined} */
  let fn;
  for (let index = 0; index < children.length; index++) {
    const child = children[index];
    switch (child.type) {
      case "definition":
        throw new InterpretError(\`named parameters are not yet supported\`, { node: child, scope });
      case "operator":
        // TODO: should raise an error for operators if the operator is not between its arguments. Currently (< 1 2), (1 2 <=), etc, work unexpectedly
        // TODO! special case: (a == b != c) should not be valid syntax (it is evaluated and then crashes)
        // TODO! special case: (a < b <= c) is not ((a < b) <= c), which would crash, but rather ((a < b) and (b < c))
        fn = dustOperators[child.text];
        break;
      case "function_called": {
        const fnNode = child.children[1];
        if ((fnNode.type === "identifier") && (parameters.length === 1)) {
          const associatedFunction = getType(parameters[0]).associatedFunctions[fnNode.text];
          if (associatedFunction) {
            fn = associatedFunction;
            break;
          }
        }
        const fnValue = interpret(fnNode, scope, null, shouldStop);
        if (isControlFlow(fnValue)) {
          return fnValue;
        }
        if (typeof fnValue === "function") {
          fn = fnValue;
          break;
        }
        // TODO why is the cast necessary?
        const apply = getType(/** @type {DustValue} */(fnValue)).associatedFunctions.apply;
        if (apply) {
          fn = apply;
          parameters.unshift(fnValue);
          break;
        }
        throw new InterpretError(\`Expected a function, got \${dustValueType(fnValue)}\`, { node: child, scope }, { cause: { fnValue } });
      }
      default: {
        const value = interpret(child, scope, null, shouldStop);
        if (isControlFlow(value)) {
          return value;
        }
        parameters.push(value);
      }
    }
  }
  if (!fn) {
    throw new InterpretError(\`Bug: expected exactly one function, but only got parameters\`, { node, scope }, { cause: { parameters } });
  }
  if (parameters.length < fn.length) {
    // TODO merge/reconcile this branch with the code that does the same thing for user-defined functions. This branch only gets hit for built-in functions, since all user-defined functions have a .length of 0, because they are variadic.
    if (parameters.length === 0) {
      return fn;
    }
    if (fn !== dustOperators['-']) {
      /** @type {DustFunction} */
      const partiallyAppliedFunction = fn.bind(null, ...parameters);
      partiallyAppliedFunction.dustFunctionName =
        \`"\${fn.dustFunctionName ?? fn.name}" (partially applied)\`;
      partiallyAppliedFunction.takesSelf = false; // "self" must be the first, so it has already been bound in the curried function.
      return partiallyAppliedFunction;
    }
  }

  try {
    return fn.apply(null, parameters);
  } catch (error) {
    if (error === STOP) {
      throw error;
    }
    if (error instanceof InterpretError) {
      error.addFnToStack(fn, node);
      throw error;
    }
    // console.error(\`unknown error \${error instanceof Error} \${error instanceof InterpretError} \${error.name}\`, error, Object.getPrototypeOf(error));
    throw new InterpretError(\`Bug in interpreter\`, { node, scope }, { cause: error }).addFnToStack(fn, node);
  }
};

/**
 * 
 * @param {DustGroupNode<"definition">} node 
 * @param {DustScope} scope
 * @param {DustScope | DustRecord} destination
 * @param {(() => unknown) | undefined} shouldStop
 * @returns {DustValue | DustControlFlow}
 */
const interpretDefinitionOrAssignment = (node, scope, destination, shouldStop) => {
  // TODO check the types?
  const
    patternNode = definitionPattern(node),
    valueNode = definitionValue(node);
  switch (patternNode.type) {
    case "identifier_declaration": {
      const
        name = identifierDeclarationName(patternNode),
        value = interpret(valueNode, scope, name, shouldStop);
      if (isControlFlow(value)) {
        return value;
      }
      throwIfHasOwn("constant", patternNode, scope, destination, name);
      Object.defineProperty(destination, name, {
        value,
        writable: false,
        enumerable: true,
        configurable: false,
      });
      return value;
    }
    case "variable_declaration": {
      const
        name = identifierDeclarationName(patternNode.children[1]),
        value = interpret(valueNode, scope, name, shouldStop);
      if (isControlFlow(value)) {
        return value;
      }
      throwIfHasOwn("variable", patternNode, scope, destination, name);
      Object.defineProperty(destination, name, {
        value,
        writable: true,
        enumerable: true,
        configurable: false,
      });
      return value;
    }
    case "set_declaration": {
      if (scope !== destination) {
        // TODO catch this in the parser!
        throw new InterpretError(\`"set" expressions are not allowed in records\`, { node, scope }, { cause: destination });
      }
      const
        identifierNode = patternNode.children[1], // TODO add accessor
        value = interpret(valueNode, scope, identifierNode.text, shouldStop);
      if (isControlFlow(value)) {
        return value;
      }
      return setVariable(identifierNode, scope, value);
    }
    case "function_call": {
      const
        children = patternNode.children,
        /** @type {string[]} */
        parameterNames = [],
        /** @type {boolean[]} */
        parameterWritable = [];
      let
        /** @type {string | undefined} */
        fnName,
        takesSelf = false;
      for (let index = 0; index < children.length; index++) {
        const child = children[index];
        let parameterName, writable;
        switch (child.type) {
          case "identifier_declaration":
            parameterName = identifierDeclarationName(child);
            writable = false;
            break;
          case "variable_declaration":
            parameterName = identifierDeclarationName(child.children[1]);
            writable = true;
            break;
          case "typed_declaration":
            const parameterPatternNode = definitionPattern(child);
            if (parameterPatternNode.type !== "identifier_declaration") {
              throw new InterpretError(\`"\${parameterPatternNode.type}" patterns are not (yet) supported\`, { node: parameterPatternNode, scope });
            }
            parameterName = identifierDeclarationName(parameterPatternNode);
            writable = false;
            break;
          case "identifier":
            if (child.text !== "self") {
              // TODO this should be checked in the parser!
              throw new InterpretError(\`Identifiers other than the special keyword "self" are not (yet) supported as function parameters (found "\${child.text}": did you mean declare a parameter "$\${child.text}"?)\`, { node: child, scope });
            }
            if (index !== 0) {
              throw new InterpretError(\`"self" parameter must come first, before the function name or any other parameters (found \${index} nodes before "self")\`, { node: child, scope });
            }
            parameterName = "self";
            writable = false;
            takesSelf = true;
            break;
          case "definition":
            throw new InterpretError(\`Default values for parameters are not yet supported\`, { node: child, scope });
          case "operator":
            throw new InterpretError(\`Operator overloading is not yet supported\`, { node: child, scope });
          case "function_called": {
            const fnNode = child.children[1];
            if (fnNode.type !== "identifier_declaration") {
              throw new InterpretError(\`Expected a function identifier declaration, but found "\${fnNode.type}"\`, { node: fnNode, scope });
            }
            fnName = identifierDeclarationName(fnNode);
            continue;
          }
          // @ts-expect-error: may fall through to error case
          case "keyword":
            if (child.text === ANONYMOUS_FUNCTION_NAME) {
              fnName = ANONYMOUS_FUNCTION_NAME;
              continue;
            }
          // Fall through to error case:
          default: {
            throw new InterpretError(\`Unexpected node type "\${child.type}"\${isLeaf(child) ? \`: \${child.text}\` : ""}\`, { node: child, scope });
          }
        }
        if (parameterNames.includes(parameterName)) {
          throw new InterpretError(\`Duplicate function parameter name "\${parameterName}"\`, { node: child, scope });
        }
        parameterNames.push(parameterName);
        parameterWritable.push(writable);
      }

      if (!fnName) {
        throw new InterpretError(\`Bug: expected exactly one function, but only got parameters\`, { node, scope }, { cause: { parameterNames } });
      }
      const dustFunction = makeDustFunction(
        fnName,
        parameterNames,
        parameterWritable,
        takesSelf,
        node,
        scope,
        shouldStop,
      );
      if (fnName !== ANONYMOUS_FUNCTION_NAME) {
        throwIfHasOwn("constant", node, scope, destination, fnName);
        Object.defineProperty(destination, fnName, {
          value: dustFunction,
          writable: false,
          enumerable: true,
          configurable: false,
        });
      }
      // TODO what happens if I put an anonymous function in a record or "in" expression, like this?
      // {(λ $x = x + 1)}
      // ((λ $x = x + 1) in 42)
      // Answer: it unexpectly works: the first one evaluates to {} and the second to 42
      // TODO parser should probably catch this so the interpreter/compiler doesn't need to worry about it.
      return dustFunction;
    }
    default:
      throw new InterpretError(\`"\${patternNode.type}" patterns are not (yet) supported\`, { node: patternNode, scope });
  }
};

/**
 * 
 * @param {string} fnName 
 * @param {readonly string[]} parameterNames 
 * @param {readonly boolean[]} parameterWritable 
 * @param {boolean} takesSelf 
 * @param {DustGroupNode<"definition">} node 
 * @param {DustScope} scope
 * @param {(() => unknown) | undefined} shouldStop
 * @returns {DustFunction}
 */
const makeDustFunction = (fnName, parameterNames, parameterWritable, takesSelf, node, scope, shouldStop) => {
  const valueNode = definitionValue(node);
  /** @type {DustFunction} */
  const dustFunction = (...parameters) => {
    if (parameters.length < parameterNames.length) {
      if (parameters.length === 0) {
        return dustFunction;
      }
      /** @type {DustFunction} */
      const partiallyAppliedFunction = dustFunction.bind(null, ...parameters);
      partiallyAppliedFunction.dustFunctionName =
        \`\${fnName} with [\${parameterNames.slice(0, parameters.length).join(' ')}] bound\`;
      partiallyAppliedFunction.takesSelf = false; // "self" must be the first, so it has already been bound in the curried function.
      return partiallyAppliedFunction;
    }
    if (parameters.length > parameterNames.length) {
      throw new InterpretError(\`too many parameters for "\${fnName}": expected \${parameterNames.length} but got \${parameters.length}\`, { node, scope }, { cause: { parameters, parameterNames } });
    }
    /** @type {DustScope} */
    const fnScope = Object.create(scope);
    // TODO: named parameters
    for (let i = 0; i < parameters.length; i++) {
      // TODO: throw an InterpretError for duplicate parameter names
      Object.defineProperty(fnScope, parameterNames[i], {
        value: parameters[i],
        writable: parameterWritable[i],
        enumerable: true,
        configurable: false,
      });
    }
    const result = interpret(valueNode, fnScope, fnName, shouldStop);
    if (isControlFlow(result)) {
      throw new InterpretError(\`\${controlFlowContainer(result)} not found for "\${controlFlowDescriptor(result)}"\`, { node: result.node, scope: fnScope });
    }
    return result;
  };
  dustFunction.dustFunctionName = fnName;
  dustFunction.takesSelf = takesSelf;
  dustFunction.sourceCode = node;
  return dustFunction;
};

const ANONYMOUS_FUNCTION_NAME = 'λ';

/**
 * @param {"constant" | "variable"} category
 * @param {DustNode} node
 * @param {DustScope} scope 
 * @param {DustScope | DustRecord} destination 
 * @param {string} name
 */
const throwIfHasOwn = (category, node, scope, destination, name) => {
  if (!Object.hasOwn(destination, name)) {
    return;
  }
  if (scope !== destination) {
    throw new InterpretError(\`A \${category} "\${name}" is already defined in this record\`, { node, scope }, { cause: destination });
  }
  throw new InterpretError(\`Shadowing not (yet) supported for \${category}s: "\${name}" is already defined in this scope\`, { node, scope });
};

/**
 * 
 * @param {DustLeafNode<"identifier">} node 
 * @param {DustScope} scope 
 * @param {DustValue} value 
 * @returns {DustValue}
 */
const setVariable = (node, scope, value) => {
  const identifier = node.text;
  let scopeNode = scope;
  do {
    const descriptor = Object.getOwnPropertyDescriptor(scopeNode, identifier);
    if (descriptor?.writable) {
      scopeNode[identifier] = value; // TODO also enable "freezing": turn a variable into a constant after you're done changing it.
      return value;
    }
    if (descriptor) {
      throw new InterpretError(\`Cannot set "\${identifier}" because it's a constant\`, { node, scope });
    }
    scopeNode = Object.getPrototypeOf(scopeNode);
  } while (scopeNode);
  throw new InterpretError(\`"\${identifier}" not found in scope\`, { node, scope });
};

/**
 * 
 * @param {DustGroupNode<"string" | "fancy_string" | "french_string">} node 
 * @param {DustScope} scope
 * @param {StringStartToken | ""} startQuote
 * @param {StringEndToken | ""} endQuote
 * @param {(() => unknown) | undefined} shouldStop
 * @returns {string | DustControlFlow}
 */
const interpretString = (node, scope, startQuote, endQuote, shouldStop) => {
  let result = startQuote;
  for (const childNode of node.children) {
    switch (childNode.type) {
      case "text":
        result += childNode.text;
        break;
      case "function_call":
      case "parenthesized_value": {
        let interpolatedValue = interpret(childNode, scope, null, shouldStop);
        if (isControlFlow(interpolatedValue)) {
          return interpolatedValue;
        }
        if (typeof interpolatedValue !== "string") {
          interpolatedValue = dustValueToString(interpolatedValue);
        }
        // TODO! look up an associated function like "to-string" and error if there isn't one
        result += interpolatedValue.replaceAll('{', "\\\\{").replaceAll('}', "\\\\}");
        break;
      }
      // “There are (/* function “"divide" (partially applied)” (source code not available) */) [1 2 3] \\{\\} weeks in a year, and 42 * 77 is 3234”

      // TODO:
      // case "escape_sequence": {
      //   result += fullText.slice(nextCharacterStartIndex, childNode.startIndex - firstCharacterGlobalIndex);
      //   // TODO! handle escape sequences other than "\\"" and "\\(", etc
      //   result += childNode.text.slice(1);
      //   nextCharacterStartIndex = childNode.endIndex - firstCharacterGlobalIndex;
      //   break;
      // }
      case "fancy_string":
        result += interpretString(childNode, scope, '“', '”', shouldStop);
        break;
      case "french_string":
        result += interpretString(childNode, scope, '«', '»', shouldStop);

          index++;

  switch (nodes.length) {
    case 0:
      return groupNode("unit", gaps, EMPTY_ARRAY);
    case 1:
      if (nodes[0].type !== "keyword") {
        return groupNodeUnsafe("parenthesized_value", gaps, nodes);

      switch (nodes[0].text) {
        case "return":
          return groupNodeUnsafe("return_expression", gaps, nodes);
        case "continue":
          return groupNodeUnsafe("continue_expression", gaps, nodes);          
      }
      addError(state, nodes[0], {
        message: \`Expected one or more expressions after "\${nodes[0].text}"\`

      return groupNodeUnsafe("parenthesized_value", gaps, nodes);
  }

  if (isKeyword(nodes[0], 'λ')) ;

  checkFirstOrLastNode(state, "before", nodes[0]);
  checkFirstOrLastNode(state, "after", nodes[nodes.length - 1]);

  let colonIndex = -1, equalSignIndex = -1;
  for (let i = 1; i < nodes.length; i++) {
    switch (nodes[i].type) {
      case ':':
        if (colonIndex !== -1) {
          addError(state, nodes[i], {message: \`Extra ':' found\`});
          break;
        }
        if (equalSignIndex !== -1) {
          addError(state, nodes[i], {message: \`Unexpected ':' found after '='\`});
        }
        colonIndex = i;
        break;
      case '=':
        if (equalSignIndex !== -1) {
          addError(state, nodes[i], {message: \`Extra '=' found\`});
          break;
        }
        if (colonIndex === (i - 1)) {
          multiAddError(state, nodes, colonIndex, i + 1, {message: \`Expected expression between ':' and '='\`});
        }
        equalSignIndex = i;
        break;

  if (equalSignIndex !== -1) {
    condenseGroupPart(state, gaps, nodes, equalSignIndex + 1, nodes.length);
    if ((colonIndex !== -1) && (colonIndex < equalSignIndex)) {
      condenseGroupPart(state, gaps, nodes, colonIndex + 1, equalSignIndex);
      condenseGroupPart(state, gaps, nodes, 0, colonIndex);
    } else {
      condenseGroupPart(state, gaps, nodes, 0, equalSignIndex);

    // TODO if the part before the \`=\` is a "set" or "write" group, return a different expression type, and raise an error if there's a (: type) part
    return groupNodeUnsafe("definition", gaps, nodes);

  if (colonIndex !== -1) {
    condenseGroupPart(state, gaps, nodes, colonIndex + 1, nodes.length);
    condenseGroupPart(state, gaps, nodes, 0, colonIndex);
    return groupNodeUnsafe("typed_declaration", gaps, nodes);

  // TODO for "parenthesized_value", a small improvement would be to check if the only child node is itself a compact "function_call" node, and inline that into the parent group, e.g. for (-foo).bar, specifically the (-foo) part:
  // Initially it's (parenthesized_value ['(', (function_call ['-', "foo"]), ')'])
  // But it could be (function_call ['(', '-', "foo", ')'])
  return postProcessGroupPart(state, gaps, nodes, "parenthesized_value");

  switch (node.type) {

    case '=':

/** @import { WorkerRunnerMessage, WorkerRunnerResponse } from "./types" */

self.onmessage = (/** @type {MessageEvent<WorkerRunnerMessage>} */ message) => {
  try {
    const { fileName, text, stopper } = message.data;
    let errors, program;
    try {
      [errors, program] = parse(text);
    } catch (error) {
      respond({ type: "crash in the parser", data: ensureIsError(error) });
      return;
    }
    if (errors) {
      respond({ type: "parse errors", data: null });
      return;
    }
    const
      stopperArray = stopper && new Uint8Array(stopper),
      shouldStop = stopperArray && (() => stopperArray[0]);
    try {
      const results = interpretProgram(program, fileName, shouldStop);
      let next;
      while (!(next = results.next()).done) {
        const result = next.value;
        respond({
          type: "result",
          data: {
            value: dustValueToString(result.value),
            row: result.row,
            column: result.column,
            performance: result.performance,
          },
        });
      }
      const result = next.value;
      if (typeof result === "string") {
        respond({ type: result, data: null });
      } else {
        respond({ type: "crash in the program", data: result });
      }
      return;
    } catch (error) {
      respond({ type: "crash in the interpreter", data: ensureIsError(error) });
      return;
    }
  } catch (error) {
    respond({ type: "crash in the worker thread", data: ensureIsError(error) });
    return;
  }
};

/** @type {(response: WorkerRunnerResponse) => void} */

  // console.log(\`\${new Date().toISOString()} respond\${response.type === "result" ? \` line=\${response.data.row + 1} value=\${response.data.value}\` : ""}\`, response);
  if (response.data instanceof Error) {
    console.error(response.type, response.data);
  } else if (response.type === "crash in the program") {
    console.warn(\`Crash in the program at line \${response.data.row + 1}, column \${response.data.column + 1}\`, response.data.error, \`\\ncaused by:\\n\`, response.data.error.cause);

          index++;

  //     - pro: more extensible, since other languages will be added later
  //     - con: requires service worker to preload and cache things for offline use
  const
    worker = new Worker(WORKER_RUNNER_URL, { type: __WORKER_TYPE__ }),
    stopper = makeSharedArrayBuffer(),
    startTimeNotification = `${new Date().toLocaleTimeString()}: program started`,
    timer = state.runStatus.lastChild;
  worker.onerror = onWorkerErrorEvent.bind(state, "Editor got an error from the worker thread");
  worker.onmessageerror = onWorkerErrorEvent.bind(state, "Editor got a message-error from the worker thread");
  worker.onmessage = onWorkerResponse.bind(state, state.text);
  worker.postMessage(/** @satisfies {WorkerRunnerMessage} */({
    fileName: state.editor.fileName,
    text: state.text,
    stopper,
  }));
  state.runningState = {
    worker,
    stopper: stopper && new Uint8Array(stopper),
    stopTimer: startTimer(timer.firstChild),
  };
  timer.title = "Program run time";
  setRunStatusIcon(state, runningIcon.cloneNode(true));
  state.runStatus.title = startTimeNotification;
  state.runButton.title = "Stop the program";
  state.playIcon.replaceWith(state.stopIcon);
  onProgramChangedOrRunRestarted(state);
  showResults(state);
  setResultsText(state, `// ${startTimeNotification}\n`);

};

/**
 * @param {InternalState} state 
 * @param {RunningState} runningState
 * @param {RunStopReason} reason
 * @param {SVGSVGElement} stopIcon
 * @param {number} [sourceRow]
 */
const stop = (state, runningState, reason, stopIcon, sourceRow) => {
  const
    { worker, stopper, stopTimer } = runningState,
    notification = `${new Date().toLocaleTimeString()}: ${reason}`;
    state.runningState = null;
    stopTimer();
  if (stopper) {
    stopper[0] = 1;
  }
  worker.terminate();
  state.runStatus.lastChild.title = "Last program run time";
  stopIcon = stopIcon.cloneNode(true);
  if (sourceRow !== undefined) {
    stopIcon.addEventListener(
      "pointerdown",
      scrollToLine.bind(state, state.contents, state.lineNumbers, sourceRow, 0),
    );
    const resultRow = state.programRowToResultRow.get(sourceRow);
    if (resultRow !== undefined) {
      stopIcon.addEventListener(
        "pointerdown",
        scrollToLine.bind(state, state.results, state.results.firstChild, resultRow + 1, 0),
      );
    }
    stopIcon.style.cursor = "pointer";
  }
  setRunStatusIcon(state, stopIcon);
  state.runStatus.title = notification;
  state.runButton.title = RUN_BUTTON_TITLE;
  state.stopIcon.replaceWith(state.playIcon);
  if (notification.includes('\n')) {
    setResultsText(state, state.resultsText + `/*\n${notification}\n*/`);
  } else {
    setResultsText(state, state.resultsText + `// ${notification}`);
  }
};

/**
 * @this {InternalState}
 * @param {string} textAtStart
 * @param {MessageEvent<WorkerRunnerResponse>} event 
 */
const onWorkerResponse = function (textAtStart, event) {
  const
    response = event.data,
    runningState = this.runningState;
  if (response.type === "result") {
    showResult(this, textAtStart, response.data);
    return;
  }
  if (!runningState && (response.type === "stopped")) {
    return;
  }
  if (!runningState) {
    console.error(`Got response from worker thread after it was already stopped`, response);
    return;
  }
  switch (response.type) {
    case "done":
      stop(this, runningState, "Program completed successfully", successIcon);
      return;
    case "stopped":
      stop(this, runningState, "Program was stopped", stoppedIcon);
      return;
    case "parse errors":
      stop(this, runningState, "Program had parse errors", errorIcon);
      return;
    case "crash in the parser":
    case "crash in the interpreter":
    case "crash in the worker thread":
      stop(this, runningState, `Editor hit a ${response.type}`, errorIcon);
      return;
    case "crash in the program": {
      const data = response.data;
      showCrash(this, textAtStart, data);
      stop(this, runningState, `Program crashed at Line ${data.row + 1}, Column ${data.column + 1}:\n${response.data.error}\n`, errorIcon, data.row);
      return;
    }
    default:
      // @ts-expect-error: makes sure all cases got handled
      return response.type;
  }
};

/**
 * @this {InternalState}
 * @param {RunWorkerErrorMessage} message 
 * @param {Event} event 
 */
const onWorkerErrorEvent = function (message, event) {
  if ((message === "Editor got an error from the worker thread") && !navigator.onLine) {
    message += ` (if you are offline, that might be why)`; // TODO better message
  }
  console.error(message, event);
  if (this.runningState) {
    stop(this, this.runningState, message, errorIcon);
  }
};

/** @returns {SharedArrayBuffer | undefined} */
const makeSharedArrayBuffer = () => {
  if (window.SharedArrayBuffer) {
    return new SharedArrayBuffer(1);
  }
  console.error(`SharedArrayBuffer is not defined, so some features (like stopping execution of a program mid-run) might not work very well. Make sure to set the following HTTP headers:\nCross-Origin-Embedder-Policy: require-corp\nCross-Origin-Opener-Policy: same-origin`);
};

/** @this {InternalState} */
const toggleFullScreen = async function() {
  if (!requestFullscreen || !exitFullscreen) {
    return;
  }
  const
    button = this.fullScreenButton,
    wasFocused = button.matches(":focus");
  button.disabled = true;
  try {
    if (button.title === ENTER) {
      button.title = ENTERING;
      await requestFullscreen.call(this.editor);
    } else {
      button.title = EXITING;
      await exitFullscreen.call(document);
    }
  } finally {
    button.removeAttribute("disabled");
    if (wasFocused) {
      button.focus();
    }
  }
};

class DustFileEditor extends HTMLElement {
  /** @readonly */
  #state = new InternalState(this);

  /** @type {AbortController | undefined | null} */
  #abortController;

  connectedCallback() {
    if (!this.isConnected) {
      return; // Could have been connected and immediately disconnected
    }
    this.#abortController?.abort();
    const
      state = this.#state,
      signal = (this.#abortController = new AbortController()).signal,
      focusOnLoad = this.dataset.focusOnLoad,
      toFocus = (focusOnLoad !== undefined) && FOCUS_ON_LOAD_MAP.get(focusOnLoad);
    if (this.classList.contains(RESULTS_SHOWN) && !resultsShown(state)) {
      console.error(`Class name "${RESULTS_SHOWN}" is reserved for internal use`, this);
    }
    matchMedia("(prefers-color-scheme: dark)")
      .addEventListener("change", this.update.bind(this), { signal });

    setUpFullScreenButton(state, signal);
    if (state.isMobile) {
      setUpSelectionOnMobile(state, signal);
    } else {
      setUpTabKeyBehaviorIndicator(state, signal);
    }
    updateStyle(state);
    updateContents(state);
    if (toFocus === undefined) {
      console.error(`Unrecognized "data-focus-on-load" value "${focusOnLoad}" (expected one of [${[...FOCUS_ON_LOAD_MAP.keys().map(it => `"${it}"`)].join(", ")}])`, this);
    } else if (toFocus) {
      state[toFocus].focus({ preventScroll: true });
    }
    setUpLocalStorage(state, signal);
  }

  disconnectedCallback() {
    this.#abortController?.abort();
    this.#abortController = null;
  }

  /** @returns {string} */
  get fileName() {
    return this.dataset.fileName ?? "untitled";
  }

  /** Call this function after changing styles like `font-size`, `--line-height`, etc. */
  update() {
    updateStyle(this.#state);
    queueUpdateContents(this.#state);
  }

  /**
   * @param {string} text 
   */
  setText(text) {
    const cursorPosition = Math.min(this.#state.selectedRange.end, text.length);
    setEditorText(this.#state, text, cursorPosition, cursorPosition);
  }

  /** @param {InternalState["onTextChanged"]} onTextChanged */
  setTextChangeListener(onTextChanged) {
    this.#state.onTextChanged = onTextChanged;
  }
}

/** @type {ReadonlyMap<string, keyof InternalHTMLElements>} */
const FOCUS_ON_LOAD_MAP = new Map([
  ["program", "program"],
  ["run-button", "runButton"],
]);

if (document.readyState === "loading") {
  console.error(`Document is still loading: make sure to use type="module" with this script so it waits for the document to fully stream in before running`);
} else {
  customElements.define("dust-file-editor", DustFileEditor);
}

export { DustFileEditor };
</script>
